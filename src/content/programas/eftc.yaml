nombre: Curso de entrenamiento de funciones ejecutivas (EFTC)
en_ingles: Executive Function Training Course
para_que: Un curso para preescolar que entrena con juegos frenar un impulso, la memoria de trabajo y la flexibilidad.
edades: De 3 a 6 años
edad_desde: 3
edad_hasta: 6
quien: Terapeutas de rehabilitación y especialistas en análisis de conducta, en un centro médico.
formato: En grupos de seis niñas y niños cada día, más dos sesiones individuales a la semana.
duracion: 16 semanas, con una sesión de grupo de 30 minutos al día y dos individuales de 30 minutos a la semana.
en_espana: Sin datos sobre su uso en España. Se ha estudiado en China, y el artículo no dice si el curso está disponible.
peso: ensayo
que_es: >
  Es un curso pensado para niñas y niños autistas de preescolar. Trabaja tres funciones ejecutivas:
  frenar un impulso, la memoria de trabajo y la flexibilidad. Se basa en el análisis aplicado de
  conducta (ABA): enseñar paso a paso, con ayudas que se van retirando y con refuerzos. Toma ideas de
  Unstuck and On Target, adaptadas a niñas y niños más pequeños. Lo crearon un hospital y un centro de
  intervención en autismo de Pekín.
como_es: >
  Primero se enseña por separado lo que hace falta para cada habilidad, en sesiones individuales. Después
  se practica jugando en grupo, en juegos con reglas en los que, por ejemplo, hay que esperar una señal
  antes de moverse o recordar varias cosas a la vez.
que_encontraron: >
  Un ensayo de 2026, con 72 niñas y niños de 3 a 6 años, lo comparó con el tratamiento habitual del
  centro. Con el curso mejoraron más en las pruebas de funciones ejecutivas, sobre todo en frenar un
  impulso y en la memoria de trabajo. Pero las familias no notaron más cambios en el día a día que con
  el tratamiento habitual. Los propios autores concluyen que la mejora aún no se había trasladado a la
  vida diaria.
en_ninas: >
  Sin datos sobre niñas. En el ensayo, más de 8 de cada 10 participantes eran niños, y no se miraron los
  resultados de las niñas por separado.
limitaciones: >
  Es un solo ensayo, en China y sin seguimiento después de terminar. Las niñas y los niños tenían un nivel
  de desarrollo bastante bueno, así que no se sabe si sirve igual para quien necesita más apoyo. El
  tratamiento habitual también podía trabajar algo las funciones ejecutivas. Y nadie del colegio valoró
  los cambios.
que_preguntar:
  - ¿Hay en nuestra zona algo parecido para preescolar, con juegos en grupo?
  - ¿Se puede trabajar lo mismo en la atención temprana que ya recibe?
  - ¿Cómo veremos si se nota en casa, y no solo en las pruebas?
relacionados: [funciones-ejecutivas]
fuentes: [fan-2026]
revisado: 2026-11-20
