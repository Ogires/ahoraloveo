nombre: Integración sensorial
en_ingles: Ayres Sensory Integration
para_que: Una terapia de juego con terapeutas ocupacionales que busca cambiar cómo se procesa lo que llega por los sentidos.
edades: De 3 a 11 años en los ensayos
edad_desde: 3
edad_hasta: 11
quien: Terapeutas ocupacionales con formación en integración sensorial.
formato: Individual, en una consulta de terapia ocupacional, con actividades de juego.
duracion: >
  24 sesiones en 26 semanas en el ensayo más grande, más dos llamadas con la familia. En otro, 30
  sesiones de una hora en 10 semanas.
en_espana: Sin datos sobre su uso en España, ni estudios con niñas y niños españoles.
peso: sin-beneficio
que_es: >
  La integración sensorial es una terapia de juego que hacen terapeutas ocupacionales. La guía europea
  ESCAP explica que trabaja con el tacto, el movimiento y la sensación del propio cuerpo, para ayudar a
  regularse. Busca cambiar cómo procesa la niña o el niño lo que le llega por los sentidos, no cambiar
  el entorno. Es distinta de los apoyos sensoriales sueltos, como los chalecos o las mantas con peso, de
  los que esta página también cuenta lo que se sabe.
como_es: >
  Las sesiones son de juego, en una sala de terapia ocupacional. La terapeuta prepara actividades con
  movimiento y con sensaciones distintas, ajustadas a lo que le cuesta a cada niña o niño. Se fijan
  unos objetivos propios para cada uno, por ejemplo vestirse con menos ayuda o jugar con otras niñas y
  niños, y al final se mide si se han alcanzado.
que_encontraron: >
  El ensayo más grande, de 2022, sorteó a 138 niñas y niños de primaria del Reino Unido. Comparó la
  terapia con la atención habitual. A los 6 y a los 12 meses, la irritabilidad y la agitación no habían
  mejorado más que en el otro grupo, y la terapia no salía rentable. Las familias y las terapeutas sí
  contaron mejoras en el día a día. En un ensayo de 2014 con 32 niñas y niños de 4 a 8 años, avanzaron
  más en sus objetivos propios, pero no cambiaron las conductas del autismo. Sobre las mantas con peso,
  un ensayo con 73 niñas y niños no encontró mejora en el sueño ni en la conducta, aunque a ellos y a
  sus familias les gustaban. No hay estudios de las mantas para las crisis. La NAS las cuenta entre el
  material sensorial que se puede probar.
  Lo publicado desde 2023 va en la misma línea. Una revisión de 2025, con 9 ensayos y 344
  participantes, encontró pruebas fuertes de que ayuda a alcanzar las metas propias de cada niña o niño.
  Y pruebas moderadas de que no sirve para conductas como la irritabilidad, así que no la recomienda para
  eso ni para la resistencia a los cambios. Un ensayo de 2025 con 35 niñas y niños de 3 a 10 años, frente
  a solo un programa en casa, vio más avances en las metas de las familias. Otro metaanálisis de 2025, con
  16 ensayos de una versión china del método, concluyó que mejora, pero todos los ensayos eran de China.
  La NAS dice que la poca investigación que hay sugiere que suele ayudar, y pide más estudios.
en_ninas: >
  En el ensayo de 2014 había 6 niñas entre 32. El de 2022 no da el número, pero sí comparó por sexo: con
  la terapia, las niñas tuvieron algo más de irritabilidad que los niños. Los autores avisan de que es
  solo una pista para seguir estudiando, no una conclusión.
limitaciones: >
  Una revisión de 2017 encontró que solo 3 de sus 24 estudios tenían poco riesgo de sesgo, y que eran
  pequeños y cortos. Mejoraban algunas medidas sensoriales y motoras, con pruebas de poca calidad. Otra
  revisión, de 2015, encontró pocos efectos de los apoyos sensoriales sueltos, como los chalecos con
  peso, aunque muchos estudios no seguían bien los protocolos. La guía ESCAP dice que hay poca evidencia
  de esta terapia y de los chalecos con peso. Y añade que cambios sencillos en el entorno, como el
  ruido, la luz o la ropa, pueden reducir mucho los problemas. Una revisión de 2019 la considera una
  práctica con pruebas a partir de dos ensayos con 69 participantes, y otra de 2024 se apoya en ella. La
  de 2019 la firman especialistas en el método, entre quienes está la primera firmante del ensayo de
  2014, aunque nadie valoró un estudio propio.
que_preguntar:
  - ¿Qué objetivo concreto queremos conseguir, y cómo sabremos si se alcanza?
  - ¿Se puede cambiar antes algo del entorno, en casa o en el cole?
  - ¿Cuántas sesiones hacen falta y cuánto cuestan?
