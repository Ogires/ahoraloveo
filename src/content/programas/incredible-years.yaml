nombre: Incredible Years para autismo y retraso del lenguaje
en_ingles: Incredible Years Autism Spectrum and Language Delays (IY-ASLD)
para_que: Un curso en grupo para familias de niñas y niños pequeños, sobre las emociones, la relación con los demás y el lenguaje.
edades: De 2 a 8 años
edad_desde: 2
edad_hasta: 8
quien: >
  Profesionales con formación acreditada en el programa. En España, psiquiatras infantiles y psicólogas
  y psicólogos clínicos de la sanidad pública.
formato: En grupo, solo para las familias. En el estudio español fue por videollamada.
duracion: >
  De 12 a 14 sesiones semanales en grupo. Por videollamada, 22 sesiones en unos seis meses.
en_espana: >
  Se probó por primera vez en España en un estudio en los servicios de salud mental infantil de tres
  hospitales públicos, de Málaga, Madrid y Barcelona. Sin datos sobre si se ofrece de forma habitual.
peso: pequenos
que_es: >
  Incredible Years es una serie de cursos para familias. Esta versión está pensada para
  familias de niñas y niños autistas o con retraso del lenguaje, de 2 a 8 años. Busca ayudarles a
  regular sus emociones, a relacionarse, a desarrollar el lenguaje y a llegar mejor preparados al
  colegio. Se trabaja con la familia, no directamente con la niña o el niño.
como_es: >
  En cada sesión, el grupo aprende una forma de acompañar a su hija o hijo en el día a día: con sus
  emociones, en el juego o al comunicarse. Cada familia la practica en casa hasta la sesión
  siguiente. Por ejemplo, el grupo puede hablar de cómo anticipar un cambio que le cuesta y probarlo
  esa semana.
que_encontraron: >
  Hay dos ensayos piloto, pensados sobre todo para ver si el programa se podía llevar a cabo. En uno de
  2020, 58 familias de niñas y niños de 3 a 8 años se repartieron al azar entre hacer el curso enseguida
  o esperar. Unas 7 de cada 10 familias que empezaron lo terminaron, y no se vieron diferencias entre
  los dos grupos. En el estudio español, de 2026, participaron 62 familias de niñas y niños de 2 a 5
  años. Tampoco hubo diferencias frente a la atención habitual en el estrés de las familias ni en las
  dificultades de sus hijas e hijos. Los dos equipos dicen que hace falta un ensayo más grande.
en_ninas: >
  Sin datos sobre niñas: los resúmenes de los dos ensayos no dicen cuántas niñas había, ni miran sus
  resultados aparte.
limitaciones: >
  Son estudios pequeños, que no estaban pensados para detectar diferencias. En el estudio español no
  todas las niñas y niños eran autistas: también había niñas y niños prematuros con dificultades de
  comunicación. Para aplicarlo hay que formarse con quienes crearon el programa, y una de las autoras del
  protocolo del primer ensayo es formadora en los cursos Incredible Years. No sabemos si enseña a ignorar ciertas
  conductas: las fuentes que hemos leído no describen las sesiones. Ninguna de las guías que hemos
  consultado lo nombra.
que_preguntar:
  - ¿Hay algún grupo de familias como este cerca, presencial o por videollamada?
  - ¿Qué aprenderemos en el grupo para cuando tenga una crisis?
  - ¿Cómo vamos a saber si nos ayuda?
relacionados: [meltdown]
fuentes: [williams-2017, valencia-2021, williams-2020, valencia-agudo-2026]
