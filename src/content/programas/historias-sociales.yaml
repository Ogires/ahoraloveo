nombre: Historias sociales
en_ingles: Social Stories
para_que: Historias cortas, escritas para ella, que le explican una situación o un cambio que viene.
edades: De 4 a 11 años en el ensayo más grande. Otro estudio llega hasta los 15.
edad_desde: 4
edad_hasta: 11
quien: >
  El profesorado o el personal del colegio, y también la familia, después de una formación. Según el
  equipo que las estudió, hace falta poca ayuda de especialistas.
formato: Individual. Se escribe una historia para ella, con texto e imágenes, y se lee con ella en el colegio o en casa.
duracion: En el ensayo más grande, la historia se leía al menos seis veces en cuatro semanas.
en_espana: >
  La guía de Autismo Castilla y León para el profesorado explica cómo escribirlas, con un ejemplo sobre un
  cambio: un día con una maestra suplente. Sin estudios con niñas y niños españoles.
peso: sin-beneficio
que_es: >
  Una historia social es un texto corto, escrito para una niña o un niño concreto, sobre una situación que
  le cuesta. Le cuenta de forma tranquila y positiva qué pasa, por qué y qué puede esperar. Las creó Carol
  Gray. Se usan para muchas cosas: entender las rutinas y los cambios, las emociones, las relaciones o la
  clase. La guía ESCAP explica que, como TEACCH, se apoyan en claves visuales para que entienda mejor.
como_es: >
  Por ejemplo, si la semana que viene hay una excursión, se escribe una historia con su nombre y fotos del
  sitio. Cuenta adónde van, cómo irán, qué harán allí y a qué hora volverán. Se lee con ella varias veces
  antes de la excursión, en un momento tranquilo, y se puede volver a leer el mismo día.
que_encontraron: >
  Un ensayo de 2025 se hizo en 87 colegios del Reino Unido con 249 niñas y niños de 4 a 11 años. Comparó añadir
  historias sociales con la atención habitual. A los seis meses no hubo diferencia en la medida
  principal, un cuestionario sobre cómo se relacionaba con los demás. Sí cumplieron más a menudo la meta
  concreta que se había elegido para cada niña o niño, según el profesorado. Entre los temas de esas metas
  estaban las rutinas, los cambios y las transiciones, pero el estudio no da sus resultados aparte. No
  cambiaron la ansiedad, el ánimo ni el estrés de las familias. Una revisión de 2010 encontró que su
  eficacia general era baja o dudosa, y algo mayor con conductas concretas que para enseñar habilidades
  sociales.
en_ninas: >
  Pocas niñas. En un estudio previo había 13 niñas de 50, y en un piloto con una aplicación, 1 de 15. El
  ensayo grande dice que el reparto por sexo era parecido en los dos grupos, sin dar la cifra en el
  texto. Ningún estudio miró los resultados de las niñas por separado.
limitaciones: >
  La pandemia afectó al ensayo grande, y el equipo no descarta que, con más lecturas, ayuden más. Se
  registraron seis incidentes, dos de ellos graves, y uno se consideró probablemente relacionado con las
  historias. El artículo no dice cuál. Una persona del equipo es coautora de una guía de historias
  sociales, y dona lo que cobra por ella a un hospicio infantil. Antes de este ensayo no había ensayos
  adecuados: casi todo eran estudios de un solo caso. La guía ESCAP, anterior a este ensayo, dice que su
  eficacia aún no se ha demostrado.
que_preguntar:
  - ¿Podemos preparar una historia para un cambio que viene, como una excursión o una profesora nueva?
  - ¿Quién la escribe y quién se la lee, en casa y en el cole?
  - ¿Cómo vamos a saber si le ayuda?
relacionados: [rigidez-y-rutinas]
fuentes: [wright-2025, wright-2024, wright-2016, marshall-2016, hanrahan-2020, kokina-2010, escap-2021, autismo-cyl-profesores]
revisado: 2026-11-25
