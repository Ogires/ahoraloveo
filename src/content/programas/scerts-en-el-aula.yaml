nombre: SCERTS en el aula
en_ingles: Classroom SCERTS Intervention
para_que: Un modelo para el colegio que forma al profesorado para apoyar la comunicación y la regulación emocional en las actividades de clase.
edades: De 5 a 8 años
edad_desde: 5
edad_hasta: 8
quien: >
  El profesorado y el personal del aula, después de un taller de tres días y con una persona que los
  asesora durante el curso.
formato: >
  En clase, dentro de las actividades de cada día. No son sesiones aparte: los apoyos se integran en lo
  que se hace en el aula.
duracion: Un curso escolar. En el ensayo, ocho meses, con la meta de usarlo 25 horas a la semana.
en_espana: >
  Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. El libro de Barry Prizant,
  uno de los autores del modelo, está traducido al castellano.
peso: ensayo
que_es: >
  SCERTS es un modelo que pone el foco en tres cosas: la comunicación social, la regulación emocional y
  los apoyos que dan las personas de alrededor. Su versión para el colegio forma al profesorado para
  meter esos apoyos en las actividades de clase. Busca que el alumnado autista participe más, y cambia
  sobre todo lo que hacen las personas adultas. Barry Prizant, uno de sus autores, explica en un libro de
  divulgación que también busca prevenir los comportamientos que dificultan aprender. Y desaconseja
  ignorarlos: propone preguntarse qué los motiva y para qué sirven.
como_es: >
  El profesorado aprende a usar apoyos dentro de la clase. Por ejemplo, avisar antes de cambiar de
  actividad, usar apoyos visuales o partir de lo que le interesa en ese momento. También a ir
  pidiéndole un poco más. Una asesora va a clase, mira cómo se aplican los apoyos y da ideas
  ajustadas a cada docente.
que_encontraron: >
  Un ensayo de 2018 sorteó 60 colegios de Estados Unidos, con 197 alumnas y alumnos de infantil a 2.º de
  primaria. Comparó SCERTS en el aula con unos módulos en línea de formación para el profesorado. Con
  SCERTS mejoraron más la comunicación en el día a día, las habilidades sociales y las funciones
  ejecutivas. Según el profesorado, también bajaron más los problemas de conducta. Las grabaciones de
  clase, valoradas por alguien que no sabía el grupo, iban en la misma dirección. Los autores hablan de
  efectos modestos y de una eficacia todavía preliminar.
en_ninas: >
  Unas 37 niñas entre 197 participantes: el artículo da el porcentaje de niños, no el número de niñas.
  No se miraron sus resultados aparte.
limitaciones: >
  Es un solo ensayo, sin seguimiento después del curso. El profesorado y las familias sabían qué grupo
  les tocaba. No mide las crisis: los problemas de conducta salen de un cuestionario del profesorado. Una
  de las autoras escribió el manual del modelo y cobra por él, aunque no por este estudio. La guía
  europea ESCAP pone SCERTS entre los modelos con alguna evidencia, aunque más débil.
que_preguntar:
  - ¿El colegio conoce SCERTS u otro modelo parecido?
  - ¿Qué apoyos se pueden usar en su clase para avisarla de los cambios y ayudarla a calmarse?
  - ¿Cómo vamos a saber si le ayuda?
relacionados: [meltdown]
fuentes: [morgan-2018, prizant-seres-humanos-unicos, escap-2021]
