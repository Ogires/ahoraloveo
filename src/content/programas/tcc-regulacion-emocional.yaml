nombre: Terapia cognitivo-conductual para regular las emociones
en_ingles: Cognitive behavioural therapy for emotion regulation (Secret Agent Society - Operation Regulation, STAMP)
para_que: Enseña a reconocer las emociones, a notar cuándo sube el malestar y a calmarse, con la familia al lado.
edades: De 4 a 12 años
edad_desde: 4
edad_hasta: 12
quien: >
  Psicólogas y psicólogos con formación en el programa. Una persona adulta de la familia participa en
  las sesiones o en un grupo de familias al mismo tiempo.
formato: >
  Secret Agent Society - Operation Regulation es individual, con la niña o el niño y una persona de su
  familia. STAMP se hace en grupo, con un grupo de familias a la vez.
duracion: >
  10 sesiones en Secret Agent Society - Operation Regulation y 9 sesiones de una hora en STAMP. El
  programa para la ira de Kate Sofronoff y Tony Attwood tiene 6 sesiones semanales de dos horas.
en_espana: Sin datos sobre su uso en España, ni estudios con niñas y niños españoles.
peso: ensayo
que_es: >
  Son programas de terapia cognitivo-conductual adaptados a niñas y niños autistas para ayudarles a
  regular sus emociones. Enseñan a reconocerlas y a ponerles nombre, a notar cuándo sube el malestar y a
  calmarse. Los más estudiados son Secret Agent Society - Operation Regulation, para 8 a 12 años, y
  STAMP, para 4 a 7. La familia participa para llevar lo aprendido a casa y al colegio. Buscan que ella
  aprenda a regularse, con el apoyo de quienes la rodean.
como_es: >
  Se empieza por reconocer las emociones, en una misma y en los demás. Luego se practica relajarse, y se
  usan escalas para medir cuánto malestar se siente. Poco a poco, se hace frente a situaciones que
  cuestan un poco más cada vez, usando lo aprendido. También hay actividades de atención plena. En las
  sesiones se prepara un plan para los momentos difíciles en casa y en el colegio. La persona de la
  familia sigue su propio manual y ayuda a practicar fuera.
que_encontraron: >
  En un ensayo de 2018 con 68 niñas y niños de 8 a 12 años, se comparó Secret Agent Society - Operation
  Regulation con una lista de espera. Las familias contaron que regulaban mejor sus emociones y tenían
  menos cambios bruscos de humor. En lo que contestaron las propias niñas y niños no hubo diferencias.
  En el grupo tratado, la mejora seguía 10 semanas después, pero sin otro grupo con el que comparar. En
  otro ensayo de 2007, con 45 niñas y niños, las familias contaron menos episodios de ira. Con STAMP, en
  23 niñas y niños de 4 a 7 años, bajaron los cambios bruscos de humor y subió la confianza de las
  familias, pero la regulación no cambió. Una revisión de 2026 con 38 estudios encontró un efecto
  moderado de esta terapia en la regulación emocional, y concluye que su utilidad depende del contexto.
en_ninas: >
  Pocas niñas. En el ensayo de 2018 había 8 niñas entre 68 participantes, y en el de STAMP, 4 entre 23.
  Ningún estudio miró los resultados de las niñas por separado.
limitaciones: >
  Casi todo lo cuentan las familias, que saben que su hija o hijo está en el programa. En el ensayo de
  2018, la valoración de la clínica también salía de lo que contaban ellas. Se excluyó a quien tenía
  conductas agresivas o autolesivas graves, y hacía falta cierta capacidad para seguir las sesiones.
  Ningún estudio mide las crisis por sobrecarga como tales. La guía europea ESCAP habla de los programas
  de habilidades sociales, entre ellos el Secret Agent Society original. Dice que se ha evaluado poco si
  lo aprendido se nota en la vida real.
que_preguntar:
  - ¿Está adaptado a niñas y niños autistas, y a su edad?
  - ¿Cómo participa la familia, y cómo se practica en casa y en el cole?
  - ¿Cómo vamos a saber si le ayuda, también según lo que cuente ella?
relacionados: [meltdown]
fuentes: [weiss-2018, factor-2019, scarpa-2011, sofronoff-2007, shaffer-2023, li-2026c, nuske-2024, escap-2021]
revisado: 2026-11-23
