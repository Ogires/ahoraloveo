nombre: Programas para familias sobre la incertidumbre
en_ingles: Coping with Uncertainty in Everyday Situations (CUES)
para_que: Grupos para familias que enseñan a ayudarle cuando no saber qué va a pasar le provoca ansiedad.
edades: >
  De 4 a 16 años, con versiones distintas: CLK-CUES, de 4 y 5 años; CUES-Junior, de 4 a 7, y CUES, de 6
  a 16.
edad_desde: 4
edad_hasta: 16
quien: >
  Dos profesionales con experiencia en autismo infantil en cada grupo. En CUES-Junior, al menos una es
  psicóloga clínica.
formato: >
  En grupo y solo para las familias: la niña o el niño no va a las sesiones. Entre una sesión y otra, la
  familia practica en casa.
duracion: Ocho sesiones semanales de dos horas en CUES y en CUES-Junior. Seis sesiones de dos horas en CLK-CUES.
en_espana: >
  Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. Los estudios son del Reino
  Unido y de Australia.
peso: ensayo
que_es: >
  A algunas niñas y niños autistas les angustia mucho no saber qué va a pasar. Es lo que se llama
  intolerancia a la incertidumbre, y el equipo que creó estos programas la relaciona con la insistencia en
  que nada cambie. CUES es un programa para familias que busca que vuestra hija o hijo lleve mejor la
  incertidumbre del día a día, en lugar de intentar evitarla. Hay una versión para 4 a 7 años,
  CUES-Junior, y otra para 4 y 5 años, CLK-CUES, que lo combina con un programa sobre la ansiedad.
como_es: >
  Cada familia elige una situación en la que su hija o hijo lo pasa mal por no saber qué va a pasar. Por
  ejemplo, no saber quién irá a buscarla al cole. En el grupo aprenden qué es la incertidumbre, qué la
  dispara y qué estrategias pueden probar. Después, la familia practica con ella, poco a poco, situaciones
  con algo de incertidumbre, y reduce lo que hace para darle siempre certeza. El equipo avisa de que,
  al principio, puede costarle más. En la versión para pequeños hay más apoyos visuales, guiones para
  jugar y estrategias prácticas.
que_encontraron: >
  Ningún estudio midió si cambiaban sus rutinas o sus rituales: midieron la ansiedad y cómo llevaba la
  incertidumbre. En un ensayo de 2026 con 64 niñas y niños de 4 a 7 años, se comparó CUES-Junior con
  esperar. Según personas que no sabían en qué grupo estaba cada familia, mejoró claramente 1 de cada 3, frente
  a ninguno de los que esperaban. Lo valoraban a partir de entrevistas con las familias. En un ensayo de
  2023 con 50 niñas y niños de 6 a 16 años, todos con ansiedad, no hubo diferencia en las situaciones
  elegidas en los seguimientos. Al terminar el programa, sí hubo más familias con mejoras en un tipo de
  situación: 12 frente a 2. En otro ensayo, con 57 niñas y niños de 4 y 5 años, la ansiedad ante la
  incertidumbre bajó solo con el programa, y seguía igual al año. Otras medidas de ansiedad no cambiaron.
  Ninguna familia contó efectos negativos.
en_ninas: >
  Entre 1 de cada 4 y 1 de cada 3 participantes eran niñas: 14 de 59 en el ensayo de 2026, 16 de 50 en el
  de 2023 y 19 de 57 en el de 4 y 5 años. Ningún estudio miró los resultados de las niñas por separado.
limitaciones: >
  Las personas que crearon CUES participan en todos los estudios, y una de ellas cobra regalías por libros
  sobre la ansiedad. Los ensayos son pequeños, y lo que se mide sale de lo que cuentan las familias. En el
  de 2023, la mitad del grupo de comparación no fue a ninguna sesión, y el equipo dice que no se puede
  concluir que sea eficaz. En el de 2026, el seguimiento no tiene un grupo con el que comparar. En el de 4
  y 5 años, el grupo del programa empezó con más ansiedad, y el equipo avisa de que parte de la mejora
  puede deberse a eso. Hay otro programa parecido para 4 a 6 años, DINOSAUR, con un solo estudio piloto
  de 14 niñas y niños, sin grupo de comparación. Además, enseña a la familia a ignorar la conducta ansiosa.
que_preguntar:
  - ¿Su rigidez puede tener que ver con la ansiedad de no saber qué va a pasar?
  - ¿Hay algún grupo para familias sobre la ansiedad en el autismo cerca de nosotros?
  - Si practicamos con situaciones inciertas, ¿cómo lo hacemos sin que se desborde?
relacionados: [rigidez-y-rutinas]
fuentes: [ong-2026, rodgers-2023, adams-2026, rodgers-2017, keefer-2021, keefer-2024]
revisado: 2026-11-25
