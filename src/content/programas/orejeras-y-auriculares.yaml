nombre: Orejeras y auriculares contra el ruido
en_ingles: Ear defenders, noise-cancelling headphones
para_que: Protectores para los oídos que bajan el ruido que le molesta, en casa, en el cole o fuera.
edades: De 4 a 16 años en los estudios.
edad_desde: 4
edad_hasta: 16
quien: >
  La familia y el colegio, con la niña o el niño. Un artículo de 2026 pide que se haga con un plan y
  ajustado a cada caso.
formato: >
  Orejeras que tapan toda la oreja, auriculares que cancelan el ruido o auriculares que van dentro del
  oído. Se usan cuando y donde hace falta.
duracion: En los estudios, de una a dos semanas con cada tipo.
en_espana: Sin datos sobre su uso en España. Los estudios son de Japón, Estados Unidos y Australia.
peso: pequenos
que_es: >
  Las orejeras y los auriculares contra el ruido bajan el sonido que llega a los oídos. No cambian cómo
  percibe, sino lo que le llega. La NAS los cuenta entre lo que ha ayudado a personas autistas. Isabel
  Paula pone ejemplos: tapones si le molesta el ruido de la cadena del váter, o auriculares con su música
  mientras le cortan el pelo.
como_es: >
  Conviene probarlos primero en un sitio tranquilo, para que se acostumbre a llevarlos. Después se usan
  en los momentos que le cuestan, como el comedor, una fiesta o el centro comercial. En un estudio, las
  familias y el profesorado contaron que prepararlo antes ayudaba. Y que muchas niñas y niños aprendían a
  saber cuándo los necesitaban y a pedirlos.
que_encontraron: >
  En un estudio de 2016 con 21 niñas y niños de 4 a 16 años, cada uno usó dos semanas unas orejeras y
  dos semanas unos auriculares con cancelación de ruido. Con las orejeras avanzaron más en las metas que
  había elegido su familia. Con los auriculares no hubo diferencia en conjunto, aunque mejoraron 5. Hubo
  5 que no los quisieron o los dejaron porque con ellos oían mejor las voces, y 4 no quisieron ponerse ninguno por la presión. En
  otro estudio, con 13 de 6 a 13 años, unos auriculares internos mejoraron la atención al escuchar con
  ruido de fondo, pero no entender lo que se decía. De los 10 que acabaron, 8 quisieron seguir usándolos.
  En un tercero, con 6, bajó la activación medida en la piel.
en_ninas: >
  Pocas niñas: 5 de 21 en el primer estudio y 3 de 13 en el segundo. Dos de esas tres niñas dejaron los
  auriculares porque les quedaban grandes. Ningún estudio miró los resultados de las niñas por separado.
limitaciones: >
  Son estudios pequeños, cortos y sin seguimiento. En dos de ellos, la empresa que fabrica los
  auriculares puso dinero o los aparatos. Las orejeras también apagan las voces, que son importantes para
  comunicarse. Un equipo plantea que usarlas mucho podría aumentar la sensibilidad al ruido con el tiempo,
  como se ha sugerido en personas con acúfenos, pero no lo midió. La NAS da el mismo aviso. Otro equipo
  recuerda que evitar del todo los sonidos podría aumentar la ansiedad. No hay ninguna revisión sobre
  ellos.
que_preguntar:
  - ¿En qué momentos le molesta más el ruido, y podría llevar protectores entonces?
  - ¿Puede llevarlos en el cole, también en el comedor y en el patio?
  - ¿Cuánto tiempo conviene llevarlos cada día?
relacionados: [hiper-e-hiposensibilidad]
fuentes: [ikuta-2016, zanin-2024, pfeiffer-2019b, pfeiffer-2019a, herrebroden-2026, nas-sensory-processing, paula-ansiedad-2015]
