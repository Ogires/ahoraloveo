nombre: Intervenciones conductuales sobre los rituales
en_ingles: FITBI, functional communication training, pivotal response treatment
para_que: Técnicas de terapia de conducta para que haga menos rituales o cambie de actividad con más facilidad. Algunas bloquean el ritual o ignoran la conducta.
edades: De 3 a 7 años en los estudios que dan la edad.
edad_desde: 3
edad_hasta: 7
quien: La familia, guiada por terapeutas de conducta. En el PRT, también terapeutas en consulta.
formato: Individual, en casa o en consulta.
duracion: >
  Doce sesiones semanales de una a dos horas en FITBI. En el estudio del PRT, 16 semanas, con siete horas
  a la semana.
en_espana: >
  Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. La guía ESCAP cuenta el PRT
  entre las intervenciones con alguna prueba, aunque más débil.
peso: pequenos
que_es: >
  Son técnicas de la terapia de conducta que buscan que haga menos rituales o conductas repetitivas, o que
  cambie de actividad con más facilidad. No coinciden en cómo hacerlo. FITBI interrumpe o bloquea el
  ritual, premia otra conducta e ignora el ritual. Otra técnica le enseña a pedir con palabras o gestos
  que le dejen volver a la rutina interrumpida, y la conducta difícil deja de servirle. Y otras premian
  variar: hacer otras actividades o pedir las cosas de formas distintas. Una de ellas es el tratamiento
  de respuesta fundamental (PRT).
como_es: >
  En FITBI, la familia le pone delante algo que suele desencadenar el ritual y le pide que no lo haga. Si
  hace falta, la guía con las manos hacia otra actividad, y la premia cuando lo hace. En el PRT se
  aprovecha lo que le interesa y se le anima a variar, por ejemplo a pedir las cosas con palabras
  distintas. En la técnica de comunicación, cuando le interrumpen una rutina, aprende a pedir que le
  dejen terminarla, y poco a poco se espacia cuándo se le concede.
que_encontraron: >
  Solo hay estudios muy pequeños y sin grupo de comparación. Con FITBI, en 5 niños de 3 a 5 años, las
  conductas repetitivas bajaron entre un 40 y un 70 % durante el tratamiento. En 3 niñas o niños, la
  conducta difícil aparecía para recuperar una rutina interrumpida, y la técnica de comunicación la
  redujo. En otros 3, premiar otras actividades mejoró su conducta, el ánimo y la relación con su familia, y su
  participación en los planes familiares. En el estudio del PRT, con 15 niñas y niños de 4 a 7 años, las
  familias contaron menos conductas repetitivas, también menos dificultad con los cambios de rutina. Una
  revisión de 2012 avisa de que casi toda la investigación es sobre conductas repetitivas más simples, y
  no sobre la insistencia en que nada cambie.
en_ninas: >
  Muy pocas niñas. En FITBI no había ninguna: eran 5 niños. En el estudio del PRT había 5 niñas de 15, y no
  se miraron sus resultados aparte. Los resúmenes de los otros dos estudios no dicen cuántas había.
limitaciones: >
  Son estudios de 3 a 15 participantes y sin grupo de comparación. El PRT trabaja sobre todo la
  comunicación social, y las conductas repetitivas solo de forma indirecta. Varias técnicas chocan con lo
  que explica esta web. FITBI trata las conductas repetitivas como algo que hay que cambiar, bloquea el
  ritual e ignora la conducta. Su equipo preparaba un plan porque, al guiarle con las manos, la conducta
  difícil podía empeorar. Y reconoce que quizá los niños solo aprendieron a no hacerlo delante de la
  familia y de quien hacía la terapia. La técnica de comunicación también deja de responder a la conducta difícil. La NAS, la
  asociación británica de autismo, recuerda que, si las rutinas y los rituales no hacen daño, no hace
  falta cambiarlos.
que_preguntar:
  - ¿Este ritual le hace daño o le limita, o le ayuda a calmarse?
  - ¿La técnica bloquea el ritual o ignora la conducta? ¿Qué haremos si al principio lo pasa peor?
  - ¿Cómo sabremos si mejora también fuera de las sesiones?
relacionados: [rigidez-y-rutinas]
fuentes: [boyd-2011, rispoli-2014, lin-2018, ventola-2016, boyd-2012, escap-2021, nas-preference]
revisado: 2026-11-25
