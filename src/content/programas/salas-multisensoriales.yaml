nombre: Salas multisensoriales
en_ingles: Multi-Sensory Environments, Snoezelen
para_que: Salas con luces, sonidos y texturas para explorar o relajarse. Hay pocas pruebas de lo que aportan.
edades: De 3 a 12 años en los estudios con niñas y niños.
edad_desde: 3
edad_hasta: 12
quien: El personal del colegio, del centro o de la terapia, acompañando a la niña o al niño.
formato: Individual, en una sala con aparatos de luz, sonido y tacto, como tubos de burbujas o paneles.
duracion: Sin una duración fija. En un estudio, 36 sesiones de 45 minutos en cuatro meses.
en_espana: Sin datos sobre su uso en España. Los estudios son del Reino Unido e Italia.
peso: pequenos
que_es: >
  Una sala multisensorial, también llamada sala Snoezelen, tiene aparatos que crean experiencias de luz,
  sonido y tacto. Se usan a menudo en colegios con niñas y niños autistas, pero apenas se ha estudiado
  cómo usarlas. No es lo mismo que el espacio tranquilo que proponen la NAS, Ambitious about Autism o
  Autismo Castilla y León. Esas entidades hablan de un lugar con pocos estímulos que le sirva de refugio, no de una
  sala con aparatos.
como_es: >
  La niña o el niño explora la sala con una persona adulta. En los estudios más recientes, es ella quien
  controla los aparatos: enciende una luz o cambia su color o el sonido, con botones o con una tableta.
  Así puede ajustar la intensidad y la duración de cada estímulo. Uno de los equipos aclara que el objetivo no es
  reducir las conductas autistas.
que_encontraron: >
  En un estudio de 2022 con 41 niñas y niños de 4 a 12 años, cuando controlaban ellos los aparatos
  prestaban más atención y hacían menos conductas repetitivas y de búsqueda de sensaciones. Solo se
  observó dentro de la sala, en sesiones de 15 minutos, y casi no hubo conductas de rechazo en ninguna de
  las dos formas. En un piloto italiano con 20 niñas y niños de 3 a 6 años, cuatro meses en la sala
  mejoraron la motricidad y algunas conductas de gusto, olfato y tacto. Una revisión de 2025 dice que
  podría ayudar con la agresividad y las estereotipias. Para lo demás, concluye que no hay pruebas
  suficientes.
en_ninas: >
  Pocas niñas: 8 de 41 en el estudio de 2022 y 3 de 20 en el piloto italiano. La revisión cuenta 45
  mujeres y niñas de 171 participantes, contando a personas adultas. Ningún estudio miró los resultados
  por sexo.
limitaciones: >
  Ningún estudio mira qué pasa después, en casa o en el cole. Tampoco se ha comparado con un cuarto de
  juego habitual, sin aparatos. Una empresa donó la sala del estudio de 2022 y otra diseñó la del piloto
  italiano. La revisión de 2025 la firma el mismo centro que hizo el piloto, que está entre los estudios
  revisados. Ninguno de esos estudios vigiló posibles efectos negativos. Ninguna de las guías que hemos
  consultado habla de salas multisensoriales.
que_preguntar:
  - ¿Para qué se usa la sala con ella, y quién decide qué aparatos se encienden?
  - ¿Puede ir allí cuando necesite descansar de tanto estímulo?
  - ¿Hay también un rincón tranquilo, sin aparatos, al que pueda ir?
relacionados: [hiper-e-hiposensibilidad]
fuentes: [unwin-2022, unwin-2024, de-domenico-2024, leonardi-2025, nas-crisis, ambitious-meltdowns-shutdowns, autismo-cyl-profesores]
