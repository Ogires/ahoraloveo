nombre: Regulating Together
para_que: Un programa de grupo para quienes tienen muchas dificultades para calmarse, con un grupo para las familias a la vez.
edades: De 8 a 18 años
edad_desde: 8
edad_hasta: 18
quien: Profesionales formados en el programa, en una consulta de hospital, sin ingreso.
formato: >
  En grupo: uno de 8 a 12 años y otro de 13 a 18, con el mismo contenido adaptado a cada edad. A la
  vez, las familias tienen su propio grupo.
duracion: 10 sesiones de 90 minutos, dos por semana durante 5 semanas.
en_espana: Sin datos sobre su uso en España, ni versión en castellano.
peso: pequenos
que_es: >
  Regulating Together es un programa de grupo para niñas, niños y adolescentes autistas con
  desregulación emocional. Es decir, reaccionan con mucha intensidad, cambian de humor de golpe y les
  cuesta mucho calmarse cuando algo les altera. Combina técnicas de terapia cognitivo-conductual y de
  atención plena, y busca que aprendan a regularse por sí mismos. A la vez, las familias aprenden a
  actuar en una crisis, a usar premios y a acompañar lo que su hija o hijo practica.
como_es: >
  En cada sesión se aprende una habilidad nueva, que se practica en el grupo y en casa, con tareas.
  Desde la segunda sesión, cada participante dice cómo se siente con una escala de cinco puntos, que va
  de estar tranquilo y con control a estar fuera de control. El grupo de familias empieza hablando de
  cómo actuar en una crisis y de un plan de seguridad. Más adelante aprende a usar premios y a ignorar
  ciertas conductas de forma planificada.
que_encontraron: >
  Un estudio de 2023 con 44 participantes de 8 a 18 años midió a cada uno antes y después del programa,
  sin grupo de comparación. En el grupo de 8 a 12 años, la intensidad de sus reacciones no cambió en
  las cinco semanas previas, sin programa, y bajó después de hacerlo. La mejora seguía 10 semanas después. La irritabilidad también
  bajó, pero ya bajaba antes de empezar. Las hospitalizaciones pasaron del 24 % al 8 % en el año
  siguiente, aunque esa diferencia puede deberse al azar. Hay en marcha un ensayo con 144 niñas y niños
  de 8 a 12 años, comparado con otro programa, que aún no ha publicado resultados.
en_ninas: >
  Muy pocas niñas: 5 entre 44 participantes, y no se miraron sus resultados aparte. El ensayo en marcha
  intenta repartir a niñas y niños por igual entre los dos grupos, pero no anuncia que vaya a mirar sus
  resultados por separado.
limitaciones: >
  No es un ensayo: no hay grupo de comparación, y casi todo lo miden las familias. Dos de las autoras
  crearon el programa y cobran por formar a profesionales. Se excluyó a quien había herido a otra
  niña, niño o adolescente en las dos semanas anteriores. El grupo de familias incluye ignorar ciertas conductas de
  forma planificada. La NAS, la asociación británica de autismo, recuerda que una crisis no es una
  rabieta.
que_preguntar:
  - ¿Hay algún programa de grupo como este cerca, y para qué edades?
  - ¿Qué aprenderemos en el grupo de familias para cuando tenga una crisis?
  - ¿Cómo vamos a saber si le ayuda?
relacionados: [meltdown]
fuentes: [shaffer-2023, mckinney-2025, nas-crisis]
revisado: 2026-11-23
