nombre: Comunicación funcional y apoyo conductual positivo
en_ingles: Functional communication training, positive behaviour support
para_que: Para las conductas difíciles que le sirven para conseguir algo, no para las crisis por sobrecarga. Enseña a pedirlo con palabras, gestos o dibujos.
edades: De 21 meses a 7 años
edad_desde: 1
edad_hasta: 7
quien: >
  La familia, en casa, guiada por una persona experta en conducta. En el ensayo, la guía era por
  videollamada.
formato: >
  Individual, en casa. Empieza averiguando para qué le sirve la conducta, y después se le enseña otra
  forma de pedir lo mismo.
duracion: >
  En el ensayo, una visita semanal de unos 60 minutos por videollamada, durante unas nueve semanas de
  media (de 3 a 20).
en_espana: >
  Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. La guía de la SEPEAP, de
  pediatría, recoge los principios del apoyo conductual positivo.
peso: revisiones
que_es: >
  La comunicación funcional parte de una idea: muchas conductas difíciles le sirven para algo, como
  conseguir un objeto o librarse de una tarea. Primero se averigua para qué le sirve. Después se le
  enseña otra forma de pedir lo mismo: hablando, señalando un dibujo o pulsando un botón. Forma parte
  del apoyo conductual positivo. La guía europea ESCAP explica que este enfoque busca enseñar
  habilidades nuevas y cambiar el entorno en lugar de castigar.
como_es: >
  Primero, la familia observa, con ayuda de la persona experta, cuándo aparece la conducta: cuando le
  quitan algo que quiere, cuando le piden una tarea... Así ven para qué le sirve. Luego le enseñan a
  pedirlo de otra forma, y cuando lo pide así, lo consigue. Por ejemplo, si le sirve para librarse de
  una tarea, aprende a pedir un descanso después de hacer lo que se le pide. Cuando aparece la conducta
  difícil, la familia la ignora o la guía para que haga lo que se le pedía.
que_encontraron: >
  Un ensayo de 2020 con 38 niñas y niños de 21 meses a 7 años comparó empezar enseguida con esperar 12
  semanas con la atención habitual. Las sesiones en casa se grababan, y la conducta difícil se contaba
  en los vídeos. Con el programa bajó de media un 98 %. Todas las niñas y niños la redujeron al menos un
  80 %, frente a 1 de cada 8 de los que esperaban. Seis meses después, en los 24 que se pudieron seguir,
  apenas había subido. Una revisión de 2018 con 26 estudios encontró que, aplicada por las familias,
  reducía la conducta difícil. Otra de 2024 cuenta entre las estrategias con más pruebas premiar la
  conducta que sustituye a la difícil y adelantarse a lo que la desencadena. La guía NICE propone
  averiguar para qué sirve una conducta difícil antes de intervenir, cuando se han descartado otras
  causas, como un problema de salud o del entorno.
en_ninas: >
  Pocas niñas. En el ensayo de 2020 había 6 niñas entre 38 participantes, y no se miraron sus resultados
  aparte. Las revisiones no dan en sus resúmenes cuántas niñas había.
limitaciones: >
  En el ensayo solo entraron niñas y niños cuya conducta les servía para conseguir algo, librarse de una
  tarea o llamar la atención. No incluyó crisis por sobrecarga: la NAS, la asociación británica de
  autismo, y Ambitious about Autism explican que una crisis no es una conducta buscada. Además, en 3 de
  cada 4 casos se empezó ignorando la conducta. Los propios autores avisan de que eso puede hacerla más
  intensa o más frecuente. Las familias y quienes las guiaban sabían cuándo estaban haciendo el
  programa, y la muestra era pequeña. La guía ESCAP dice que hay
  pocos ensayos del apoyo conductual positivo, y muchos estudios de un solo caso o de grupos pequeños.
que_preguntar:
  - ¿Para qué le sirve esta conducta, y cómo lo vamos a averiguar?
  - ¿Qué haremos si lo que tiene es una crisis por sobrecarga y no una conducta para conseguir algo?
  - ¿Cómo vamos a medir si baja, en casa y en el cole?
relacionados: [meltdown]
fuentes: [lindgren-2020, gerow-2018, lavigna-2012, nuske-2024, escap-2021, sepeap-tea-2023, nice-cg170, nas-crisis, ambitious-meltdowns-shutdowns]
