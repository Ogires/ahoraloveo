nombre: Unstuck and On Target
para_que: Un programa para el colegio que enseña a ser más flexible, a ponerse metas y a hacer un plan.
edades: De 7 a 12 años
edad_desde: 7
edad_hasta: 12
quien: >
  Personal del colegio, después de una formación corta: orientación, trabajo social, educación especial o
  profesorado. Las familias y el profesorado de la clase también reciben una formación breve.
formato: En grupos pequeños, de 3 a 6 alumnas y alumnos, en el colegio. En casa y en clase se usan las mismas frases.
duracion: >
  Casi un curso escolar: 28 sesiones de 30 a 40 minutos en el primer ensayo, y de 17 a 21 sesiones de 40 minutos
  en el último. La formación en línea para familias tiene 10 módulos semanales de 20 a 30 minutos.
en_espana: >
  Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. En Estados Unidos hay
  materiales para familias en español y unos vídeos breves gratuitos, en inglés y en español.
peso: ensayo
que_es: >
  Unstuck and On Target es un programa para el colegio pensado para niñas y niños autistas. Enseña qué
  es ser flexible, ponerse una meta y hacer un plan, por qué sirve y cómo hacerlo. Para eso usa frases
  cortas que se repiten, como «plan A, plan B» o «problema grande, problema pequeño». Las aprenden ella,
  su profesorado y su familia, para usarlas cuando se atasca. Busca que le cueste menos cambiar de plan
  y organizarse, con la ayuda de los adultos que la rodean.
como_es: >
  Se aprende con experimentos, juegos, vídeos y escenas que se representan. Por ejemplo, comprobar si
  se pasa antes un circuito de obstáculos con el cuerpo rígido o con el cuerpo flexible. O inventar
  entre todos un videojuego con obstáculos y buscar cómo salir de cada uno. Las familias reciben un
  manual para practicar las mismas frases en casa. Al principio, los adultos las recuerdan a menudo, con
  apoyos visuales, y poco a poco van retirando la ayuda.
que_encontraron: >
  En el primer ensayo, de 2014, participaron 67 niñas y niños autistas de 3.º a 5.º de primaria. Se
  comparó con un programa de habilidades sociales con el mismo número de sesiones. Los dos grupos
  mejoraron, pero con Unstuck mejoraron más la resolución de problemas, la flexibilidad y la
  planificación. En clase, personas que no sabían en qué grupo estaba cada uno vieron que seguían
  mejor las normas, cambiaban de actividad con más facilidad y se atascaban menos. En un ensayo de 2026,
  con 148 niñas y niños autistas o con TDAH, mejoró lo mismo que otro programa para el colegio. Y con la
  formación para familias, ellas notaron más flexibilidad y control de las emociones, pero no más
  organización.
en_ninas: >
  Sin datos sobre niñas. En el primer ensayo, casi 9 de cada 10 participantes eran niños, y en el de
  2026 las autoras señalan que había muy pocas niñas autistas. Ningún estudio miró los resultados de
  las niñas por separado, y las propias autoras dicen que hace falta hacerlo.
limitaciones: >
  Las autoras que lo estudian son las que lo crearon, y cobran por el manual. En el primer ensayo, las
  familias y el profesorado sabían qué programa recibía cada niña o niño. En el de las familias, solo
  ellas contaban los cambios, y no había un grupo sin formación. En los ensayos que hemos leído no se
  siguió a los participantes después de terminar, así que no se sabe si la mejora dura. Una revisión de 2021 recuerda
  que hay pocas pruebas de que estos programas se noten fuera de lo que se entrena y a largo plazo.
que_preguntar:
  - ¿El colegio o el equipo de orientación conocen este programa o alguno parecido?
  - ¿Podemos usar en casa las mismas frases que en clase cuando se atasca?
  - ¿Cómo vamos a saber si le ayuda, en clase y en casa?
relacionados: [funciones-ejecutivas, rigidez-y-rutinas]
fuentes: [kenworthy-2014, kenworthy-2023, anthony-2026, pasqualotto-2021]
revisado: 2026-11-20
