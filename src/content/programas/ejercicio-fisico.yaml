nombre: Ejercicio físico con reto
en_ingles: Cognitively engaging exercise
para_que: Deporte o juego físico que obliga también a pensar, como el minibasket, las artes marciales o aprender a ir en bici.
edades: Sobre todo de 6 a 12 años
edad_desde: 6
edad_hasta: 12
quien: >
  En los estudios, entrenadoras o entrenadores deportivos, a veces con ayudantes. Para aprender a ir en
  bici, había un adulto por cada niña o niño.
formato: En grupo o individual, en el gimnasio o el patio de un colegio o de una asociación.
duracion: >
  Lo más habitual son 12 semanas, de 2 a 5 sesiones de 40 a 60 minutos. Aprender a ir en bici se probó
  en solo 2 semanas. Según una revisión de 2026, los programas de 10 semanas o más son los que más mejoran.
en_espana: >
  No hemos encontrado ensayos con niñas y niños españoles con resultados. Hay uno en marcha en España,
  con niñas y niños autistas de 6 a 12 años, y revisiones de autores españoles.
peso: revisiones
que_es: >
  Es actividad física que, además de mover el cuerpo, obliga a pensar: seguir unas reglas, mantener el
  equilibrio, recordar una secuencia o reaccionar a lo que hace otra persona. Por ejemplo, el minibasket,
  el tenis de mesa, las artes marciales, la gimnasia o aprender a ir en bici. La idea es que ese reto
  es lo que ayuda a las funciones ejecutivas, y no solo el esfuerzo físico. Por eso los estudios lo
  comparan a veces con la bicicleta estática, que mueve el cuerpo igual pero sin ese reto.
como_es: >
  Una sesión de minibasket, por ejemplo, empieza con 5 minutos de calentamiento. Siguen 20 minutos para
  aprender lo básico del baloncesto, 10 de partido y 5 para terminar con calma. Para aprender a ir en
  bici, se empieza con ruedines y poco a poco se pasa a dos ruedas. En la gimnasia se practica andar,
  correr, gatear, dar volteretas y saltar.
que_encontraron: >
  Hay muchos ensayos pequeños y varias revisiones, de 2022 a 2026. Coinciden en una mejora de pequeña a
  moderada de las funciones ejecutivas, sobre todo en frenar un impulso y en la flexibilidad. La memoria
  de trabajo mejora poco o nada. En un ensayo con 62 niñas y niños de 8 a 12 años, quienes aprendieron
  a ir en bici mejoraron en las cuatro funciones que se midieron, y quienes hicieron bicicleta estática,
  no. Casi siempre se midió con pruebas en consulta, y casi nunca después de terminar. Una revisión no
  vio mejora clara en preescolar.
en_ninas: >
  Hay pocas niñas. En los ensayos de minibasket que reunió una revisión de 2025, casi 9 de cada 10
  participantes eran niños. Un ensayo de gimnasia tuvo la mitad de niñas, 12 de 24, pero no encontró
  diferencias con el grupo de comparación. Las fuentes que hemos consultado no dan los resultados de las
  niñas por separado.
limitaciones: >
  Muchos ensayos son pequeños y se hicieron en China: una revisión de 2025 encontró que todos los de
  minibasket eran de allí. Muchos miden con tareas en consulta, no en el día a día de casa o del
  colegio. Una revisión de 2026 pide leer los resultados con cautela, porque la certeza de las pruebas
  es baja. Y otra, de juegos físicos en grupo, no encontró una mejora clara de las funciones ejecutivas.
que_preguntar:
  - ¿Hay cerca alguna actividad que le guste y que tenga reglas, coordinación o equilibrio?
  - ¿Quien la lleva sabe adaptarla a una niña autista?
  - ¿Cuánto tiempo habría que mantenerla para ver si le ayuda?
relacionados: [funciones-ejecutivas]
fuentes: [tse-2021, tse-2026, wang-2020, deng-2025, liang-2022, hou-2024, wang-2025a, su-2026, wang-2026, gonzalez-devesa-2025, feng-2026, barrios-fernandez-2022]
