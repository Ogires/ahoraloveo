nombre: Asesoramiento a familias según el perfil sensorial
en_ingles: Contextual Intervention, Occupation-Based Coaching
para_que: Terapeutas ocupacionales ayudan a la familia a ajustar las rutinas y el entorno a cómo percibe su hija o hijo.
edades: De 2 a 10 años en los estudios.
edad_desde: 2
edad_hasta: 10
quien: Terapeutas ocupacionales, con la madre, el padre u otra persona que cuide de la niña o el niño.
formato: >
  Sobre todo con la familia: la niña o el niño casi nunca va a las sesiones. En persona o por
  videollamada.
duracion: >
  En el ensayo, 2 sesiones en grupo y 10 individuales en 11 semanas. En otro estudio, 8 sesiones por
  videollamada.
en_espana: Sin datos sobre su uso en España. Los estudios son de Estados Unidos e Irán.
peso: ensayo
que_es: >
  Se basa en el modelo de la terapeuta ocupacional Winnie Dunn, que describe distintos patrones
  sensoriales. Primero se conoce el perfil sensorial de la niña o el niño. Después, la terapeuta ayuda a
  la familia a ajustar las actividades, el entorno y las rutinas a ese perfil. Busca que participe más en
  las actividades de cada día, en casa y fuera. Trabaja con la familia, así que no expone a la niña a lo
  que le molesta.
como_es: >
  La familia elige unas metas concretas, por ejemplo poder ir juntos al supermercado o que el baño no sea
  un mal rato. La terapeuta explica cómo es su perfil sensorial y entre todos buscan qué cambiar: ir a una
  hora con menos gente, avisar antes o cambiar la luz del baño. La familia lo prueba en casa, y en la
  sesión siguiente lo revisan.
que_encontraron: >
  Un ensayo de 2019 en Irán, con 33 familias de niñas y niños de 3 a 10 años, lo comparó con esperar.
  Mejoraron los dos grupos, pero más las familias que recibieron el asesoramiento, tanto en las metas de
  participación como en la confianza de las madres. Seguían así en un seguimiento corto. Otros tres
  estudios, sin grupo de comparación, encontraron mejoras parecidas. En uno de 2025, por videollamada,
  mejoraron mucho las metas y poco la participación en general. Una revisión de 2020 dice que las pruebas
  sobre las intervenciones sensoriales son todavía escasas.
en_ninas: >
  Pocas niñas: 7 de 33 en el ensayo. Los otros estudios no dicen cuántas había. Ninguno miró los
  resultados de las niñas por separado.
limitaciones: >
  En el ensayo, las madres contaban los cambios y sabían que recibían el programa. Lo aplicó la primera
  autora, y Winnie Dunn preparó y revisó el protocolo. Las familias de los dos grupos seguían además con
  otras terapias, que no se controlaron. El artículo habla de «eliminar» los problemas sensoriales, algo
  que choca con lo que explica esta web. Dunn y otra persona de su equipo cofundaron una empresa de este
  tipo de asesoramiento. Ningún estudio mide si la niña lo pasa menos mal o tiene menos crisis.
que_preguntar:
  - ¿Le pueden hacer una valoración del perfil sensorial?
  - ¿Qué podemos cambiar en casa o en sus rutinas según ese perfil?
  - ¿Qué metas concretas nos ponemos, y cómo sabremos si se cumplen?
relacionados: [hiper-e-hiposensibilidad]
fuentes: [pashazadeh-2019, dunn-2012, little-2018, tkach-2025, lane-2020, nas-sensory-processing]
revisado: 2026-11-26
