nombre: Zones of Regulation
para_que: Un programa muy usado en colegios para reconocer las emociones y aprender formas de calmarse. Apenas se ha estudiado con niñas y niños autistas.
edades: De 6 a 13 años en los estudios
edad_desde: 6
edad_hasta: 13
quien: >
  En los estudios con autismo, una terapeuta ocupacional. Fuera de ellos, se usa sobre todo en los
  colegios.
formato: >
  En los estudios, sesiones de terapia ocupacional a las que la niña o el niño va con su familia. Al
  final de cada una, la terapeuta habla con la familia. En uno de ellos, una parte se hacía con caballos.
duracion: En los estudios, 10 sesiones semanales de 60 minutos.
en_espana: Sin datos sobre su uso en España ni sobre una versión en castellano.
peso: pequenos
que_es: >
  Zones of Regulation lo creó una terapeuta ocupacional. Enseña a reconocer las emociones, en uno mismo
  y en los demás, a ordenarlas en cuatro «zonas» y a usar herramientas para regularlas. Se basa en
  explicar las emociones y en enseñar estrategias para calmarse. Busca que la niña o el niño
  entienda cómo se siente y tenga recursos propios.
como_es: >
  En una sesión, la niña o el niño puede aprender a notar si está en calma, nervioso o muy alterado. Y
  después prueba qué le ayuda a volver a estar tranquilo, como respirar despacio, moverse o pedir un
  descanso. En los estudios con autismo, la terapeuta lo combinaba con juegos y otras actividades de
  terapia ocupacional.
que_encontraron: >
  No hay ningún estudio de Zones of Regulation solo, tal como se usa en los colegios. Un equipo probó una
  terapia ocupacional basada en sus ideas con 14 niñas y niños de 6 a 13 años, sin grupo de
  comparación. Tras 10 semanas, según las familias, bajaron la irritabilidad y la intensidad de sus
  reacciones, y la mejora se mantuvo otras 10 semanas, ya con caballos. En otro estudio, 6 niñas y niños
  de 7 a 9 años contaron que les gustó mucho montar a caballo, y menos el programa de Zones. Hay en
  marcha un ensayo en colegios con 200 alumnas y alumnos de 8 a 14 años en el que Zones es el programa
  con el que se compara otro. Sus autores dicen que Zones no tiene pruebas establecidas.
en_ninas: >
  Más niñas de lo habitual: 8 de 14 en el estudio de la terapia ocupacional, y 2 de 6 en el de las
  entrevistas. No se miraron sus resultados aparte.
limitaciones: >
  Son estudios muy pequeños, sin grupo de comparación, y la mejora la contaban las familias. Los propios
  autores avisan de que eso puede inclinar los resultados. Para entrar hacía falta tener irritabilidad.
  La terapia incluía otras actividades, así que la mejora no se puede atribuir solo a Zones. Ningún
  estudio mide las crisis por sobrecarga. Ninguna de las guías que hemos consultado lo nombra.
que_preguntar:
  - ¿Lo usan en su clase, y cómo lo adaptan para ella?
  - ¿Qué formas de calmarse le enseñan, y puede usarlas cuando las necesite?
  - ¿Cómo vamos a saber si le ayuda?
relacionados: [meltdown]
fuentes: [peters-2024a, peters-2024b, browne-2025, pickard-2024]
