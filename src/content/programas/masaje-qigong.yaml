nombre: Masaje qigong
en_ingles: Qigong Sensory Training (QST)
para_que: Un masaje diario que hace la familia, pensado para las dificultades con los sentidos, el sueño y la digestión de niñas y niños pequeños.
edades: De 2 a 6 años en los estudios
edad_desde: 2
edad_hasta: 6
quien: >
  La familia, cada día en casa, después de aprender con una terapeuta formada en el método. En el primer
  ensayo, además, una persona entrenada daba sesiones a la niña o el niño.
formato: Individual, en casa.
duracion: >
  De 4 a 5 meses en los ensayos. En el de 2009, 20 sesiones con la persona entrenada en 5 meses, además
  del masaje diario de la familia.
en_espana: Sin datos sobre su uso en España.
peso: ensayo
que_es: >
  Es un masaje que se basa en el qigong, una práctica de la medicina tradicional china. Lo hacen las
  familias cada día. Lo desarrolló un grupo de investigación para niñas y niños autistas pequeños, y
  busca mejorar sus dificultades con los sentidos, como el tacto, y también la digestión y el sueño.
como_es: >
  La familia aprende a dar el masaje con una terapeuta formada, que la acompaña en los primeros meses.
  Después lo hace cada día en casa, con un manual. Por ejemplo, con toques suaves en un orden fijo,
  fijándose en cómo lo recibe la niña o el niño.
que_encontraron: >
  Dos ensayos del grupo que lo creó compararon hacerlo con esperar. El de 2009 tuvo 46 niñas y niños
  menores de 6 años. El profesorado, que no sabía en qué grupo estaba cada uno, vio en clase mejoras en
  la relación con los demás y el lenguaje, y menos conductas autistas. En el de 2011, con 47 y aplicado
  solo por las familias durante 4 meses, mejoraron las medidas de autismo y, sobre todo, las de los
  sentidos y la autorregulación. De las revisiones, una de 2019 y otra de 2022 dicen que la calidad de
  los estudios no basta para saber si funciona. Otra de 2024, con 10 estudios y 485 niñas y niños,
  encontró mejoras en la autorregulación y en las reacciones al tacto.
en_ninas: >
  Pocas niñas. En un análisis de 2013 con 129 niñas y niños de 3 a 6 años había 25 niñas, y no se
  miraron sus resultados aparte. Los resúmenes de los dos ensayos no dicen cuántas niñas había.
limitaciones: >
  Los dos ensayos son del grupo que creó el masaje, igual que la mayoría de los estudios de la revisión
  de 2024. Las familias sabían si lo hacían, y muchas medidas las contestaban ellas. El análisis de 2013
  se hizo con los datos que el grupo ya tenía, mirando hacia atrás. Ningún estudio mide las crisis por
  sobrecarga. La revisión de 2019 propone usarlo solo como complemento, o cuando no hay acceso a otras
  terapias. Ninguna de las guías que hemos consultado lo nombra.
que_preguntar:
  - ¿Qué se espera que mejore, y cómo lo vamos a medir?
  - ¿Quién nos enseñaría a dar el masaje, y con qué formación?
  - ¿Qué hacemos si no le gusta que la toquen?
relacionados: [hiper-e-hiposensibilidad, meltdown]
fuentes: [silva-2009, silva-2011, silva-2013, rodrigues-2019, ruan-2022, fadlalmola-2024]
revisado: 2026-11-27
