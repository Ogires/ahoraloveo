nombre: Understanding Repetitive Behaviours
para_que: Un curso para familias sobre las conductas repetitivas. Ayuda a distinguir las que le hacen daño de las que la calman o le gustan.
edades: De 3 a 9 años
edad_desde: 3
edad_hasta: 9
quien: Dos profesionales del sistema de salud británico, con formación en el programa y experiencia en autismo infantil.
formato: En grupo y solo para las familias, con un manual. Cada familia trabaja sobre una conducta de su hija o hijo.
duracion: Ocho sesiones semanales de unas dos horas.
en_espana: Sin datos sobre su uso en España, ni estudios con niñas y niños españoles. Es un programa del Reino Unido.
peso: sin-beneficio
que_es: >
  Understanding Repetitive Behaviours («entender las conductas repetitivas») es un curso para familias de
  niñas y niños autistas pequeños. Enseña a reconocer sus conductas repetitivas, entender para qué le
  sirven y saber cómo responder. Busca que la familia distinga las que le hacen daño o le limitan de las
  que son neutras o le ayudan, y solo intenta reducir las primeras. Su equipo defiende que estas
  conductas forman parte de la neurodivergencia y que no hay que tratarlas como una enfermedad.
como_es: >
  Cada familia elige una conducta de su hija o hijo que tenga consecuencias, como meterse objetos en la
  boca con riesgo de atragantarse. En el grupo buscan para qué le sirve y qué la desencadena. Después
  piensan qué cambiar a su alrededor y cómo ayudarle a comunicar lo que necesita. También buscan otras
  formas de afrontar lo que antes la provocaba. Se apoyan en vídeos y en lo que cuentan las otras familias.
que_encontraron: >
  Un ensayo de 2025 con 227 niñas y niños de 3 a 9 años lo comparó con un curso sobre el autismo con las
  mismas sesiones. En la medida principal, la mejora global a las 24 semanas según el equipo clínico, no
  hubo diferencia. Sí mejoró más la conducta que había elegido cada familia, a las 10 y a las 24 semanas.
  Lo valoraba un grupo de especialistas en autismo que no sabía en qué curso estaba cada familia, a partir
  de lo que contaban ellas. Al año, la diferencia ya no era significativa. El informe final explica que,
  por la pandemia, hubo menos seguimiento del previsto y que los resultados no son concluyentes. Por eso
  no puede recomendar ninguno de los dos cursos.
en_ninas: >
  En el ensayo había 46 niñas de 227, 1 de cada 5. Se tuvo en cuenta el sexo en los cálculos, pero no se
  miraron los resultados de las niñas por separado.
limitaciones: >
  Las personas que crearon el programa firman el ensayo. Con la pandemia, solo 47 familias terminaron
  antes de las restricciones. Las conductas que eligieron las familias tenían que ver con el riesgo de
  hacerse daño, de atragantarse o de comer muy pocos alimentos. No se dieron resultados aparte sobre la
  insistencia en que nada cambie. El artículo tampoco detalla qué estrategias concretas enseña. Según el
  análisis económico, es poco probable que compense su coste frente al otro curso. Antes hubo un piloto
  con 45 familias, Managing Repetitive Behaviours, que solo comprobó que el curso se podía hacer.
que_preguntar:
  - ¿Esta conducta le hace daño o le limita, o le ayuda a calmarse?
  - ¿Para qué le sirve y qué la desencadena?
  - ¿Hay algún curso para familias sobre las conductas repetitivas cerca de nosotros?
relacionados: [rigidez-y-rutinas]
fuentes: [grahame-2025, grahame-2025b, grahame-2015]
revisado: 2026-11-25
