termino: Estereotipias
en_ingles: stimming
alias: [movimientos repetitivos, autoestimulación]
familia: sensorial
que_es: >
  Las estereotipias son movimientos o sonidos que una persona repite, como
  aletear las manos, balancearse, dar vueltas o tararear siempre la misma
  canción. Todo el mundo hace algo parecido para calmarse, como mover una
  pierna o morderse las uñas, pero las personas autistas suelen hacerlo más.
  Les ayudan a calmarse cuando algo las desborda, a concentrarse o a expresar
  alegría.
como_se_ve: >
  Puede aletear las manos cuando algo la emociona o balancearse en la silla al
  final de un día largo. También puede girar sobre sí misma en el patio o
  quedarse mirando algo que da vueltas, como un ventilador. Otras niñas y niños
  repiten sonidos o frases de una película. Suelen salir más cuando está
  nerviosa o desbordada, cuando se aburre y cuando está muy contenta.
no_confundir_con: >
  Con un trastorno obsesivo-compulsivo (TOC). El especialista en autismo Barry
  Prizant explica que, en el TOC, lo que se repite angustia y rara vez ayuda a
  sentirse mejor. Las estereotipias, en cambio, suelen calmar o dar placer. La
  psicóloga Isabel Paula avisa de que confundirlas puede llevar a un
  diagnóstico equivocado.
en_ninas: >
  AETAPI, la asociación española de profesionales del autismo, explica que las
  niñas autistas pueden tener estereotipias menos marcadas o menos frecuentes
  que los niños. Hacia los seis años, algunas empiezan a controlarlas y a
  esconderlas. Que no se vean no quiere decir que no estén. AETAPI señala
  también gestos pequeños que pueden indicar tensión, como apretar los puños,
  toquetearse la falda o enrollarse el pelo en el dedo. En un estudio con 92
  personas autistas adultas, más de la mitad mujeres, varias contaron que
  intentaban frenarlas para que no se les notara el autismo.
que_hacer: >
  Si no le hacen daño, no hace falta quitárselas: le ayudan a regularse.
  Ambitious about Autism recuerda que antes se veían como algo malo, hasta que
  se entendió para qué sirven. A veces sí conviene actuar: si las necesita todo
  el rato, si alguna le hace daño o si le trae problemas con los demás. Para
  esos casos, Barry Prizant aconseja cambiar lo que la rodea: menos ruido y
  menos desorden. También propone buscar con ella
  otra forma de calmarse, como apretar una pelota en vez de dar golpes con los
  dedos, o enseñarle dónde y cuándo hacerlas.
relacionados: [masking]
fuentes: [ambitious-estereotipias, aetapi-mujeres-tea, prizant-seres-humanos-unicos, paula-ansiedad-2015, hull-2017]
