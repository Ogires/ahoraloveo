termino: Neurodiversidad
en_ingles: neurodiversity
alias: [paradigma de la neurodiversidad, movimiento de la neurodiversidad]
familia: identidad
que_es: >
  La neurodiversidad es la variedad natural que hay en cómo se desarrolla el
  cerebro de las personas. Vista así, el autismo es una forma más de funcionar,
  ni mejor ni peor que la de la mayoría, igual que ningún idioma es más
  correcto que otro. La palabra la crearon en 1998 la socióloga autista Judy
  Singer y el periodista Harvey Blume.
como_se_ve: >
  Este enfoque cambia la pregunta. En lugar de buscar solo qué le cuesta a la
  persona autista, mira también lo que la rodea. Las investigadoras Elizabeth
  Pellicano y Jacquiline den Houting ponen el ejemplo del colegio: grande,
  ruidoso, con cambios de actividad constantes y muchas normas que nadie
  explica. Si a una niña el comedor se le hace insoportable por el ruido, la
  pregunta no es solo cómo ayudarla a aguantar, sino qué se puede cambiar en el
  comedor. Con las estereotipias, proponen cambiar cómo las ven los demás en
  vez de intentar quitárselas. También se nota en las palabras: muchas personas
  autistas prefieren «autista» a «con autismo», porque sienten que el autismo
  no se puede separar de quienes son.
no_confundir_con: >
  Con decir que el autismo no necesita apoyos. Las autoras recuerdan que las
  personas autistas pueden necesitarlos para lograr lo que se proponen. Tampoco
  es solo para quienes necesitan poco apoyo: incluye a todas las personas
  autistas, también a las que necesitan más. Y una persona no es
  «neurodiversa»: lo es un grupo. Quien se sale del desarrollo más habitual es
  neurodivergente, y quien está dentro, neurotípico.
en_ninas: >
  Sin datos sobre niñas. La revisión que usamos habla de la investigación sobre
  el autismo en general, sin separar por sexo. Sí recuerda que esconder el
  autismo para parecerse a los demás, lo que se llama masking, tiene un coste en
  las personas autistas adultas: estrés, ansiedad y burnout. Cómo se ve el
  masking en las niñas lo contamos en su ficha.
que_hacer: >
  Al hablar con el colegio, podéis preguntar qué le cuesta a vuestra hija o
  hijo. Y también qué se puede ajustar en el aula: el ruido, los cambios o las
  normas que no se dicen. Pellicano y den Houting citan además estudios que
  relacionan aceptar el autismo con una mejor salud mental, tanto en personas
  autistas adultas como en madres de niñas y niños autistas. Con sentirse a
  gusto siendo autista pasa lo mismo.
relacionados: [masking, estereotipias, doble-empatia, burnout-autista]
fuentes: [pellicano-2022]
revisado: 2026-11-05
