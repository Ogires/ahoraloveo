termino: Doble empatía
en_ingles: double empathy problem
alias: [problema de la doble empatía]
familia: social
que_es: >
  La doble empatía es la idea de que las dificultades de comunicación entre
  personas autistas y no autistas van en las dos direcciones. No es solo que a la
  persona autista le cueste entender a los demás: a las personas no autistas
  también les cuesta entenderla a ella. La propuso el investigador Damian Milton
  en 2012.
como_se_ve: >
  Un estudio de 2020 lo puso a prueba con algo parecido al juego del teléfono:
  una persona contaba una historia a otra, esta a la siguiente, y así hasta 8.
  Las cadenas formadas solo por personas autistas transmitieron la historia tan
  bien como las formadas solo por personas no autistas. Los detalles se perdían
  en las cadenas mixtas, y en ellas la gente también se sentía menos a gusto. En
  el día a día, puede que vuestra hija se entienda muy bien con otra niña autista
  y, en cambio, se pierda en el grupo de clase.
no_confundir_con: >
  Con decir que a las personas autistas no les cuesta relacionarse. La doble
  empatía no niega esas dificultades: explica que parte del problema está en el
  encuentro entre dos formas distintas de comunicarse, y no solo en la persona
  autista.
en_ninas: >
  Sin datos sobre niñas. El estudio de 2020 se hizo con 72 personas adultas, la
  mayoría mujeres, y no comparó por sexo. Sus autoras avisan de que en grupos con
  más hombres los resultados podrían ser distintos.
que_hacer: >
  Si en el colegio os dicen que «no se relaciona», preguntad con quién y en qué
  situaciones: puede que con algunas personas se entienda muy bien. Las autoras
  del estudio piden que los profesionales adapten su forma de comunicarse, y
  apoyan que las personas autistas tengan ocasión de relacionarse con otras
  personas autistas. Buscar esos ratos, por ejemplo en una asociación, puede
  darle un espacio donde le resulte más fácil entenderse.
relacionados: [masking]
fuentes: [crompton-2020, pellicano-2022]
revisado: 2026-11-05
