termino: Hiper e hiposensibilidad
en_ingles: sensory hypersensitivity and hyposensitivity
alias: [hipersensibilidad, hiposensibilidad, hiperreactividad e hiporreactividad sensorial]
familia: sensorial
que_es: >
  Muchas personas autistas perciben lo que les llega por los sentidos de otra
  manera. Algunos estímulos les llegan con demasiada fuerza (hipersensibilidad) y
  otros casi no les llegan (hiposensibilidad). A menudo una misma persona tiene las
  dos cosas, según el sentido. El DSM-5, el manual de diagnóstico, lo incluye entre
  los rasgos del autismo.
como_se_ve: >
  Con hipersensibilidad, un ruido que a otros no molesta, como el de alguien
  masticando, puede resultarle insoportable. Puede rechazar algunas texturas en la
  ropa o en la comida, o pasarlo mal en un comedor lleno y ruidoso. Con
  hiposensibilidad, puede parecer indiferente al dolor o al frío, o no quejarse
  cuando se hace daño. También puede buscar sensaciones: oler o tocar mucho las
  cosas, o quedarse fascinada mirando luces o algo que se mueve. Cuando todo llega
  a la vez, puede saturarse y acabar en un meltdown.
no_confundir_con: >
  Con ser quisquillosa o exagerar. La National Autistic Society explica que, a
  quien es hipersensible, un roce o un aviso por megafonía le pueden doler de
  verdad. Y que no se queje de un golpe fuerte no quiere decir que no haya que
  mirarlo.
en_ninas: >
  AETAPI, la asociación española de profesionales del autismo, pide fijarse en
  las niñas que no se quejan cuando se hacen mucho daño. Y también en las que, al
  contrario, sienten cualquier roce como una amenaza. En un estudio con 92
  personas autistas adultas, más de la mitad mujeres, varias contaron que
  disimulaban sus reacciones a la sobrecarga para que no se notara su autismo.
  Por eso, que no se queje no significa que no lo esté pasando mal.
que_hacer: >
  La National Autistic Society propone bajar los estímulos cuando hay sobrecarga,
  con menos luz y menos ruido, y usar apoyos como cascos que aíslan del ruido o
  gafas oscuras. Antes de un sitio con mucho ruido o mucha gente, podéis
  preguntarle qué necesita. Barry Prizant cuenta el caso de una familia que le
  decía a su hija «¿Necesitas tus auriculares? ¿Quieres irte?» y respetaba lo
  que ella contestaba. En el colegio, contad qué le molesta y qué la ayuda.
escenas:
  - edad: 5 años
    lugar: en el patio del cole
    protagonista: nina
    texto: >
      Sale al patio en manga corta en pleno enero y no parece tener frío. Se cae
      del tobogán, se levanta sin quejarse y sigue jugando, aunque le sangra la
      rodilla.
  - edad: 10 años
    lugar: en la cena
    protagonista: nina
    texto: >
      En la cena se tapa un oído con la mano y se sienta lo más lejos posible de
      su hermano, que mastica con la boca abierta. Las croquetas ni las toca: dice
      que «pinchan por dentro».
relacionados: [meltdown, estereotipias]
fuentes: [nas-crisis, escap-2021, aetapi-mujeres-tea, hull-2017, paula-ansiedad-2015, prizant-seres-humanos-unicos]
