termino: Funciones ejecutivas
en_ingles: executive functions
alias: [función ejecutiva, disfunción ejecutiva]
familia: pensamiento
que_es: >
  Las funciones ejecutivas son las habilidades que nos ayudan a organizarnos
  para conseguir algo. Sirven para planificar, tener en la cabeza lo que
  estamos haciendo, frenar un impulso o cambiar de plan si algo no sale.
  Todo el mundo las usa a diario. A muchas personas autistas les cuestan más.
como_se_ve: >
  Una revisión de 235 estudios, con más de 14.000 personas, encontró que, de
  media, a las personas autistas les cuestan más que a las no autistas. La
  diferencia era moderada y parecida en todas las áreas: planificar, la memoria
  de trabajo, la flexibilidad o frenar un impulso. Era bastante estable con la
  edad, algo menor en los adultos. En casa, puede notarse en una niña que se
  bloquea cuando cambia el plan, o que se pierde a mitad de algo con varios
  pasos, como recoger la mesa y lavarse las manos. En los cuestionarios sobre el día a día
  que rellenan las familias, las diferencias salían mucho mayores que en las
  pruebas de consulta.
no_confundir_con: >
  Con desobediencia o con pereza. La psicóloga Isabel Paula explica que, cuando
  el guion que esperaba cambia, la capacidad de resolver problemas «se congela»
  y le cuesta reaccionar. Barry Prizant, especialista en autismo, pide que, en
  vez de llamar «desobediente» a una conducta, nos preguntemos qué la motiva.
  Tampoco son una prueba de autismo: según la revisión, casi ninguna prueba de
  funciones ejecutivas distingue por sí sola a una persona autista.
en_ninas: >
  Un estudio de 2017 comparó a 79 chicas y 158 chicos autistas de 7 a 18 años,
  con la misma edad, el mismo cociente intelectual y una intensidad parecida de
  rasgos autistas y de TDAH. Sus familias veían más dificultades en las
  funciones ejecutivas de ellas, y también en las habilidades de la vida
  diaria. Es un solo estudio, y no incluye a niñas menores de 7 años. AETAPI
  señala que, ya de adultas, a algunas mujeres autistas les cuesta organizar el
  tiempo, el dinero o la casa.
que_hacer: >
  Ayuda que las cosas sean previsibles. La NAS, la asociación británica de
  autismo, aconseja dar estructura al paso de una actividad a otra: un horario
  claro y un temporizador que cuente el tiempo que queda. José Ramón Alonso
  recomienda avisar antes de los cambios y usar frases como «primero… y
  luego…»: «primero te pones los zapatos y luego salimos». E Isabel Paula
  propone enseñarle a resolver problemas, para que gane autonomía.
escenas:
  - edad: 4 años
    lugar: en casa
    protagonista: nina
    texto: >
      Cada mañana se viste con la ropa que su padre le deja en la silla. Hoy la
      camiseta de siempre está en la lavadora, y se queda parada con el pantalón
      puesto, mirando la silla. Cuando su padre le da otra, termina de vestirse.
  - edad: 9 años
    lugar: en su cuarto
    protagonista: nino
    texto: >
      Prepara la mochila para la excursión con la lista delante. Mete la
      cantimplora y va a buscar la gorra. Al volver, se queda mirando la
      mochila, lo saca todo y empieza otra vez por la cantimplora.
