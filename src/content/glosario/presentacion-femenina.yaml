termino: Presentación femenina
en_ingles: female autism phenotype
alias: [autismo femenino, fenotipo femenino]
familia: clinico
que_es: >
  La presentación femenina es una forma de mostrarse el autismo que se ve más
  en niñas y mujeres. Una revisión de 2020 explica que en ellas el autismo se
  diagnostica menos de lo que debería, quizá porque muchas lo muestran de
  formas que no encajan en los criterios actuales. Según esa revisión, los datos
  de hasta ahora apoyan que esta forma existe, pero hace falta estudiarla más,
  en todas las edades y en todos los géneros. No aparece en todas las niñas
  autistas, y algunos de sus rasgos, como el camuflaje, se ven también en niños.
como_se_ve: >
  La guía ESCAP explica que, en muchas niñas autistas, las dificultades sociales
  y de comunicación son más sutiles. Comparadas con los niños, suelen intentar
  más relacionarse y a menudo tienen una o dos amistades. También tienden a
  jugar con más imaginación, a usar un lenguaje más emocional y a tener menos
  conductas repetitivas. Y sus
  [intereses especiales](/glosario/intereses-especiales/) suelen tener un
  contenido más social. AETAPI añade que esos intereses se parecen a menudo a
  los de otras niñas, así que hay que fijarse en cómo son, no solo en el tema.
  Y habla de niñas que parecen integradas en el recreo porque están cerca de un
  grupo, pero se quedan en el borde. Un estudio de 2025 siguió a 4.550 niñas y
  niños de 20 a 40 meses, la mayoría hermanos pequeños de niñas y niños
  autistas. Con las mismas dificultades de fondo, las niñas tenían menos
  problemas para mirar a los ojos que los niños.
no_confundir_con: >
  Con un autismo más leve. Que se note menos no quiere decir que no le cueste.
  La guía ESCAP explica que el esfuerzo por parecerse a las demás, junto con un
  diagnóstico tardío y la falta de apoyos, aumenta el riesgo de problemas
  emocionales. Tampoco es lo mismo que el [camuflaje](/glosario/masking/), que
  es solo una parte. Y no describe a todas las niñas: AETAPI cuenta que unas
  parecen tímidas, a otras las guía una amiga y otras son muy desinhibidas. Las
  que tienen más problemas de conducta llaman antes la atención.
en_ninas: >
  La guía NICE avisa de que el autismo puede pasar desapercibido en las niñas.
  La guía ESCAP explica que las evaluaciones actuales no tienen en cuenta las
  diferencias entre niñas y niños, y que en ellas puede hacer falta una
  evaluación más detallada. Los autores del estudio de 2025 sacan una
  consecuencia. Para llegar al diagnóstico, una niña tiene que diferenciarse de
  las otras niñas más de lo que un niño tiene que diferenciarse de los otros
  niños. Y un estudio sueco con casi 2,8 millones de personas vio que a ellas se
  las diagnostica más tarde. A los chicos, sobre todo entre los 10 y los 14
  años, y a las chicas, entre los 15 y los 19.
que_hacer: >
  Si algo os preocupa, contadlo en la consulta aunque en el cole digan que va
  bien. AETAPI recuerda que muchas niñas pueden ir muy bien en el colegio
  mientras sus dificultades pasan desapercibidas. Y pide a quien evalúa que
  cuente con información del colegio y de la familia, así que llevad lo que
  veis en casa. La guía NICE pide no descartar el autismo solo porque mire a los
  ojos, sonría o sea cariñosa con la familia. Tampoco porque juegue a hacer como
  que o haya empezado a hablar a su edad. En la ficha del
  [ADOS-2](/diagnostico/ados-2/) contamos qué temas pueden ayudaros a preparar
  la consulta.
relacionados: [masking, intereses-especiales, comorbilidad]
fuentes: [hull-2020, escap-2021, aetapi-mujeres-tea, burrows-2025, cook-2021, nice-cg128, fyfe-2026]
