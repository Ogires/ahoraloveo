termino: Rigidez y rutinas
en_ingles: insistence on sameness
alias: [inflexibilidad, insistencia en la invariabilidad, resistencia al cambio, necesidad de rutinas]
familia: pensamiento
que_es: >
  La rigidez es la necesidad de que las cosas sigan igual: las mismas rutinas,
  en el mismo orden y sin cambios por sorpresa. Los criterios del diagnóstico la
  cuentan entre los comportamientos repetitivos. La guía ESCAP, que los recoge,
  habla de insistir en que nada cambie, cumplir las rutinas al pie de la letra o
  tener rituales. La NAS, la asociación británica de autismo, explica que las rutinas
  previsibles son muy importantes para las personas autistas. Y la psicóloga
  Isabel Paula, que las rutinas y los rituales son su principal forma de hacer
  frente al estrés y a la ansiedad del día a día.
como_se_ve: >
  La guía NICE describe cómo puede verse en preescolar: reacciones muy intensas
  ante los cambios o las situaciones nuevas, e insistir en que todo sea
  «igual». En primaria habla de preferir mucho las rutinas conocidas y que las
  cosas estén «justo así». También de que no le gusten los cambios, algo que a
  menudo le provoca ansiedad o malestar. Y de esperar que los demás niños sigan
  las reglas del juego al pie de la letra. La NAS añade otros ejemplos: querer
  saber con detalle lo que va a pasar o que las normas sean iguales para todos.
  También comer lo mismo cada día o necesitar un juguete preferido para estar
  tranquila.
  Isabel Paula explica que, cuando hay más ansiedad, la insistencia en las
  rutinas suele aumentar.
no_confundir_con: >
  Con un capricho. Barry Prizant, especialista en autismo, explica que muchas
  de estas conductas son estrategias para sentirse mejor y más tranquila. Todos
  tenemos hábitos y rituales que nos ayudan a calmarnos. Lo que la guía NICE
  señala en el autismo es una reacción muy intensa ante los cambios. Tampoco es
  lo mismo que un trastorno obsesivo-compulsivo (TOC). La guía de la SEPEAP, de
  pediatría, explica que en el autismo los rituales se viven como propios y
  ayudan a regularse. Y pide pensar en un TOC que
  [acompañe al autismo](/glosario/comorbilidad/) si aparecen ideas o conductas
  nuevas. Son las que la persona vive como absurdas, le angustian y no puede
  parar aunque quiera.
en_ninas: >
  La guía ESCAP explica que, comparadas con los niños, las niñas autistas suelen
  tener menos conductas repetitivas. AETAPI avisa de que, en ellas, los rituales
  pueden esconderse en juegos que se suelen ver como «de niñas». Por ejemplo,
  los bebés de juguete, las comiditas o jugar a las tareas de la casa. Parecen juegos de imaginación,
  pero, vistos de cerca, pueden ser poco flexibles y repetir siempre lo mismo,
  como un ritual. Por eso pide fijarse en si acepta cambios en la historia que
  se inventa. Y cuenta que, hacia los seis años, algunas niñas empiezan a
  controlar y esconder sus conductas repetitivas. Las fuentes que hemos
  consultado no estudian por separado la rigidez en las niñas.
que_hacer: >
  Un cambio de rutina puede angustiar mucho, y la NAS lo cuenta entre los
  desencadenantes habituales de un [meltdown](/glosario/meltdown/). Para los
  cambios que se pueden prever, aconseja explicarlos con un apoyo visual, como
  un dibujo, y recordar que el resto de la rutina sigue igual. Isabel Paula
  explica que anticipar lo que va a pasar es una de las reglas de oro. Pero a
  algunas personas saberlo con tiempo les da más ansiedad, y entonces conviene
  avisar justo antes. También aconseja cambiar las rutinas poco a poco y pactar
  momentos para sus rituales. Si la rigidez le hace pasarlo mal o le complica el día
  a día, contadlo en la consulta.
escenas:
  - edad: 5 años
    lugar: en su cuarto
    protagonista: nina
    texto: >
      Juega a los profes con su prima. Reparte las fichas a sus peluches siempre
      en el mismo orden: el oso, el conejo y la muñeca. Su prima le da la primera
      a la muñeca. Ella se la quita, se la da al oso y dice: «Primero el oso».
      Al rato, su prima se va a jugar a otra cosa.
    por_que: >
      Parece un juego de imaginación, pero repite el mismo orden y no acepta que
      su prima lo cambie. En algunas niñas, la rigidez se esconde así, dentro
      del juego. No es un capricho: el orden puede darle tranquilidad.
    imagen: ../../assets/escenas/rigidez-y-rutinas-1.webp
  - edad: 8 años
    lugar: en una cena en casa
    protagonista: nino
    texto: >
      Sus abuelos vienen a cenar y su madre cambia las sillas de sitio. Él coge
      la suya y la arrastra hasta el hueco de siempre, junto a la ventana. Cena
      apretado entre su abuela y la pared, con el plato en el borde de la mesa.
      No se queja en toda la cena.
    por_que: >
      Arrastra su silla al hueco de siempre y cena apretado contra la pared, sin
      quejarse. Puede necesitar que las cosas estén «justo así»: lo conocido
      puede ayudarle a estar tranquilo.
    imagen: ../../assets/escenas/rigidez-y-rutinas-2.webp
