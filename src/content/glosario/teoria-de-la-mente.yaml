termino: Teoría de la mente
en_ingles: theory of mind
alias: [mentalización, cognición social]
familia: social
que_es: >
  La teoría de la mente es la capacidad de darse cuenta de lo que otras
  personas piensan, saben, sienten o quieren, aunque no lo digan. José Ramón
  Alonso lo explica así: en el trato con los demás, «leemos» su comportamiento.
  Por sus gestos, su cara o su tono de voz, deducimos lo que saben y lo que
  esperan. Durante años se ha dicho que a las personas autistas les falta. Hoy esa
  idea se discute.
como_se_ve: >
  Un metaanálisis de 2019, con 39 estudios en adultos, encontró que en las
  pruebas de teoría de la mente la diferencia entre personas autistas y no
  autistas era grande. Pero una revisión crítica del mismo año concluye que no
  todas las personas autistas tienen esa dificultad, ni solo ellas, y que las
  distintas pruebas ni siquiera coinciden entre sí. En el día a día, puede
  tomarse las cosas al pie de la letra. Barry Prizant explica que muchas normas
  del trato no se dicen: se aprenden sin darse cuenta, por estar en medio. A
  muchas personas autistas les cuesta captarlas así, aunque pueden aprenderlas,
  como quien aprende un segundo idioma. Una persona autista le dijo que los
  demás «pueden leer las mentes».
no_confundir_con: >
  Con no tener empatía o con no querer a los demás. El estudio de 2020 sobre la
  doble empatía recoge que muchas personas autistas tienen vínculos estrechos y
  empatía con otras personas autistas. Y la dificultad va en las dos
  direcciones: a las personas no autistas también les cuesta saber qué piensa o
  siente una persona autista. Las autoras de la revisión crítica añaden que
  decir que a las personas autistas «les falta» teoría de la mente no se
  sostiene y hace daño.
en_ninas: >
  Sin datos sobre niñas. El metaanálisis de 2019 se hizo con adultos, y 3 de
  cada 4 eran hombres. AETAPI señala que algunas mujeres autistas adultas
  entienden lo que sienten los demás, pero les cuesta reaccionar de forma
  espontánea, por ejemplo, consolar a alguien.
que_hacer: >
  Dadle instrucciones exactas y completas. Alonso aconseja decir también lo que
  esperáis después: no solo «mira si tu hermano está en la ducha», sino «y
  luego ven a decírmelo». Tened cuidado con las bromas. Explicadle las normas
  que los demás dan por sabidas, sin esperar que las capte sola. AETAPI propone
  ayudarla a pensar otras explicaciones de lo que hacen los demás. Y recordad
  que entenderse es cosa de dos: también ayuda que los demás se esfuercen por
  entenderla a ella.
escenas:
  - edad: 5 años
    lugar: en casa
    protagonista: nina
    texto: >
      Su madre llega con las manos llenas de bolsas y le pregunta: «¿Puedes
      abrir la puerta?». Ella contesta «sí» y sigue jugando. Cuando su madre le
      dice «ábrela, por favor», se levanta enseguida a abrirla.
  - edad: 11 años
    lugar: en el parque
    protagonista: nino
    texto: >
      Un amigo le cuenta, muy serio, que su perro se ha perdido. Él le explica
      por qué calles del barrio suelen aparecer los perros y cuántos días
      tardan. Al día siguiente, lo primero que le pregunta es si ya ha vuelto.
