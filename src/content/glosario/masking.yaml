termino: Masking
en_espanol: [camuflaje, enmascaramiento]
alias: [camouflaging]
familia: social
que_es: >
  El masking son las estrategias que usan muchas personas autistas para que
  no se noten sus diferencias al relacionarse con los demás. Por ejemplo,
  forzarse a mirar a los ojos, copiar los gestos o la forma de hablar de otras
  personas o preparar de antemano lo que van a decir. Muchos estudios lo llaman
  camouflaging.
como_se_ve: >
  Desde fuera, a menudo no se ve: la niña parece estar bien. En el recreo
  observa al grupo y copia lo que hacen las demás, desde cómo se ríen hasta de
  qué hablan. Por dentro supone mucho esfuerzo. En un estudio con 92 personas
  autistas adultas, la consecuencia que más se repitió fue el agotamiento, y
  algunas contaron que después necesitaban estar a solas. Una revisión de 29
  estudios encontró que camuflar más va unido a tener peor salud mental.
no_confundir_con: >
  Con timidez o con «ser muy buena». Según AETAPI, algunas niñas autistas
  parecen tímidas, calladas o muy obedientes. Como eso se espera de una niña,
  no llama la atención de docentes ni de profesionales sanitarios.
en_ninas: >
  La revisión de 29 estudios encontró que, de media, las mujeres y las niñas
  autistas camuflan más que los hombres y los niños autistas. La diferencia es
  de pequeña a moderada, y también hay chicos y hombres que camuflan. AETAPI
  recuerda que las niñas son muy distintas entre sí: algunas parecen tímidas,
  otras se apoyan en una amiga que las guía y otras son muy desinhibidas.
  Cuando el masking funciona, sus dificultades pueden pasar desapercibidas, y
  el diagnóstico puede llegar más tarde.
que_hacer: >
  Si en el colegio os dicen que está bien y en casa la veis agotada, contadlo en
  la consulta con ejemplos concretos. AETAPI recomienda que quien evalúa a una
  niña escuche a la familia y al colegio, porque cada uno puede ver una parte
  distinta. En casa, poder ser ella misma sin esforzarse en encajar también la
  ayuda a descansar.
relacionados: [meltdown, estereotipias]
fuentes: [cook-2021, hull-2017, aetapi-mujeres-tea]
revisado: 2026-11-03
