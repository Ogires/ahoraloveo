termino: Shutdown
en_espanol: [desconexión]
familia: emociones
que_es: >
  Un shutdown es otra forma de reaccionar cuando a una persona autista le llega
  más de lo que puede procesar. Es como un meltdown, pero hacia dentro: en vez
  de estallar, se apaga. Se queda callada, quieta o deja de responder, y no lo
  elige. Suele llegar cuando el estrés se ha ido acumulando y algo pequeño, como
  un ruido o un cambio de planes, termina de desbordarla.
como_se_ve: >
  Puede dejar de hablar, quedarse muy quieta o sentarse en el suelo sin
  moverse, y tardar mucho en contestar. A veces se da cuenta de lo que pasa a su
  alrededor, pero no puede responder. Puede pasar, por ejemplo, al final de una
  fiesta de cumpleaños con música alta y mucha gente: se queda en un rincón,
  callada, y no reacciona aunque la llaméis. Suele dejarla agotada.
no_confundir_con: >
  Con desobediencia, pereza o con que os esté ignorando. Ambitious about
  Autism, una organización británica dedicada a niños y jóvenes autistas,
  explica que esa confusión les hace sentirse incomprendidos y sin apoyo. Y con
  un meltdown: los dos aparecen por la misma sobrecarga, pero en el meltdown la
  tensión sale hacia fuera.
en_ninas: >
  Sin datos sobre niñas. Un estudio de 2021 entrevistó a 8 niños y jóvenes
  autistas, 3 de ellos chicas, sobre el shutdown y otras experiencias, pero no
  separó los resultados por sexo. Ambitious about Autism explica que el
  esfuerzo de camuflarse agota y puede hacer más probables los shutdowns. Y,
  según una revisión de 29 estudios, de media las niñas autistas camuflan más
  que los niños. Aun así, ningún estudio que hayamos encontrado ha comprobado si
  ellas tienen más shutdowns.
que_hacer: >
  Ambitious about Autism recomienda centrarse en entender y prevenir, no en
  controlar la conducta. Durante un shutdown, bajad el ruido y los estímulos,
  buscad un sitio tranquilo, dadle más tiempo para responder y no le hagáis
  muchas preguntas. Estad cerca y tranquilizadla, sin presionar. Con el tiempo,
  aprenderéis a ver las primeras señales de que se está saturando, y podréis
  bajar la carga antes de que llegue.
