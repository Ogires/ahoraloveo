    texto: >
      Desde hace meses, al volver del instituto se mete en la cama, y ni el fin
      de semana le basta para recuperarse. Le cuesta organizarse para los deberes
      y ducharse sin que se lo recuerden, cosas que antes hacía sola. El ruido del
      extractor de la cocina, que nunca le había molestado, ahora no lo aguanta.
