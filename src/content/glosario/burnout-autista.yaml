termino: Burnout autista
en_ingles: autistic burnout
familia: emociones
que_es: >
  El burnout autista es un agotamiento profundo que suele durar 3 meses o más.
  Aparece cuando, durante mucho tiempo, lo que se espera de una persona autista
  supera lo que puede dar y no tiene los apoyos que necesita. El primer estudio
  que lo definió, en 2020, partió de lo que contaban las propias personas autistas
  adultas.
como_se_ve: >
  Las personas adultas de ese estudio lo describían con tres rasgos. El primero,
  un cansancio que no se pasa. El segundo, la pérdida de habilidades que antes
  tenían, como organizarse, cuidarse o hablar. Y el tercero, menos tolerancia a
  los estímulos: ruidos de siempre que de pronto duelen. También contaban que tenían más meltdowns y shutdowns. En un
  estudio con niños y jóvenes de 8 a 18 años, lo describían sobre todo como un
  cansancio enorme. Uno contaba que, tras un día con dos exámenes, llegaba a casa
  y se quedaba sentado sin saber qué hacer.
no_confundir_con: >
  Con una depresión o con el desgaste del trabajo: el estudio de 2020 concluye que
  el burnout autista es algo distinto. Tampoco es lo mismo que un shutdown. El
  shutdown dura un rato; el burnout, meses, y puede traer más shutdowns.
en_ninas: >
  Sin datos sobre niñas. El estudio de 2020 entrevistó a personas adultas y no
  comparó por sexo. Sí señala el camuflaje como una de las causas del burnout.
  Ambitious about Autism, una organización británica dedicada a niños y jóvenes
  autistas, explica también que el esfuerzo de camuflarse agota. De media, las niñas
  autistas camuflan más que los niños, según una revisión de 29 estudios. Aun
  así, ningún estudio que hayamos encontrado ha comprobado si ellas tienen más
  burnout.
que_hacer: >
  Las personas autistas del estudio contaban que les ayudaba sentirse aceptadas y
  apoyadas, bajar las exigencias, tener tiempo libre y poder hacer las cosas a su
  manera, sin camuflarse. En casa, eso puede ser una temporada con menos
  actividades, tiempo a solas para recuperarse y no pedirle que se esfuerce en
  parecer como las demás. Si veis que pierde habilidades durante semanas,
  contadlo en la consulta.
