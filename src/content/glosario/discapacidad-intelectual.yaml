termino: Discapacidad intelectual
en_ingles: intellectual disability
alias: [trastorno del desarrollo intelectual]
alias_en_ingles: [learning disability]
familia: clinico
que_es: >
  La discapacidad intelectual es tener más dificultades que la mayoría para
  aprender, comprender y comunicarse, y para las habilidades de la vida diaria.
  Suele ser para toda la vida. Plena inclusión, que agrupa a las entidades
  españolas de discapacidad intelectual, explica que también depende del
  entorno: con menos barreras, hay menos dificultades. Y recuerda que no es una
  enfermedad mental.
como_se_ve: >
  En el día a día puede notarse en que le cuesta más que a otras criaturas de
  su edad aprender cosas nuevas o entender lo que se le explica. O en que
  necesita más ayuda con las tareas de cada día. Se valora con
  [pruebas de inteligencia y de habilidades para la vida diaria](/diagnostico/pruebas-de-desarrollo/),
  las mismas que se usan al evaluar el autismo. En las más pequeñas, los
  informes hablan a veces de retraso global del desarrollo o de retraso
  madurativo. Plena inclusión explica que el retraso madurativo es una
  evolución más lenta del desarrollo. Y las pruebas pueden quedarse cortas. Un
  estudio pequeño, con 38 menores autistas, comparó dos pruebas de
  inteligencia. En una de razonamiento con figuras, las matrices de Raven,
  puntuaban bastante más alto que en las escalas Wechsler. Sus autores
  concluyen que se ha subestimado la inteligencia de las personas autistas.
no_confundir_con: >
  Con el autismo. Son cosas distintas que pueden ir juntas o no: muchas
  personas autistas no tienen discapacidad intelectual, y otras sí. Cuántas,
  depende de la fuente. La guía de la SEPEAP habla de alrededor de 6 de cada 10
  personas autistas, y la guía NICE, de la mitad. En Estados Unidos, en 2022, la
  tenían unas 4 de cada 10 niñas y niños autistas de 8 años. La guía ESCAP
  explica que ahora se incluyen más casos de autismo sin discapacidad
  intelectual. Tampoco es lo mismo que las dificultades de aprendizaje, como
  con la lectura o las matemáticas. Ojo con el inglés: lo que la guía NICE
  llama «learning disability» es discapacidad intelectual.
en_ninas: >
  En los datos de Estados Unidos de 2022, la proporción con discapacidad
  intelectual era la misma en las niñas y en los niños autistas: unas 40 de
  cada 100. La
  guía ESCAP recoge que, entre quienes tienen una capacidad intelectual media o
  alta, se diagnostica a muchas menos niñas: algunos estudios hablan de hasta 8
  o 9 chicos por cada chica. Y avisa de que muchas mujeres autistas se quedan
  sin diagnóstico. Por eso, una niña autista sin discapacidad intelectual puede
  pasar más desapercibida.
que_hacer: >
  Si os hablan de discapacidad intelectual, pedid que os expliquen su perfil:
  qué se le da bien y qué le cuesta, y no solo una cifra. Plena inclusión
  recuerda que, con los apoyos adecuados, todas las personas con discapacidad
  intelectual pueden progresar. Si ya tiene este diagnóstico y veis cosas que
  os hacen pensar en el autismo, decidlo en la consulta. La guía NICE avisa de
  que, con discapacidad intelectual, el autismo se diagnostica menos. Y el grado
  de discapacidad del certificado, que se da en porcentaje, es otra cosa: lo
  valora otro equipo.
