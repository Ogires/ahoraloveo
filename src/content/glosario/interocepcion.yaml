termino: Interocepción
en_ingles: interoception
familia: sensorial
que_es: >
  La interocepción es la capacidad de notar lo que pasa dentro del propio
  cuerpo: el hambre, la sed, el cansancio o el corazón que late deprisa. Nos
  ayuda a saber cuándo comer, beber o descansar. También ayuda a reconocer las
  emociones, porque las emociones se notan en el cuerpo.
como_se_ve: >
  Se oye a menudo que las personas autistas notan peor las señales de su
  cuerpo, pero los estudios no se ponen de acuerdo. Una revisión de 2025 reunió
  31 estudios: unos encontraron que las notan menos, otros que más y otros que
  igual. En la prueba clásica, que consiste en contar los propios latidos
  durante un rato, la mayoría no vio diferencias. Aun así, a algunas personas
  autistas les pasa. La psicóloga Isabel Paula habla de personas que apenas
  notan el hambre o la sed. En casa, eso puede verse en una niña que pasa la
  tarde jugando sin pedir agua, aunque haga calor. Otras personas lo viven al
  revés: en su libro, un adulto autista cuenta que de noche le cuesta dormir
  porque siente demasiado el cuerpo.
no_confundir_con: >
  Con la hipersensibilidad o la hiposensibilidad a lo que llega de fuera, como
  los ruidos, las luces o las texturas. La interocepción es lo que llega de
  dentro del cuerpo. Las dos cosas pueden estar relacionadas, pero no son lo
  mismo. Tampoco es lo mismo que la alexitimia, la dificultad para reconocer
  las propias emociones. Hay teorías que las unen: si cuesta notar lo que pasa
  en el cuerpo, también puede costar saber qué se siente.
en_ninas: >
  Sin datos sobre niñas. La revisión de 2025 no comparó a niñas y niños, y en
  los cinco estudios con adultos que analizó juntos, casi 3 de cada 4
  participantes eran hombres. En los estudios con menores nadie tenía menos de
  6 años, y en la mayoría la media rondaba los 12 o 13. La propia revisión avisa
  de que, para medirla, hace falta entender las instrucciones y poder explicar
  con palabras lo que se nota.
que_hacer: >
  Si os parece que no nota el hambre, la sed o el cansancio, apuntad ejemplos
  concretos y comentadlo con su pediatra. Y si se queja de algo del cuerpo, que
  lo valore también: no deis por hecho que son nervios ni que exagera. Barry
  Prizant propone hacer de detective cuando el comportamiento cambia sin motivo
  aparente: preguntarse si viene de dentro, como un dolor o un malestar. Muchas
  veces, la niña o el niño no sabe explicarlo con palabras, y las pistas las
  tienen quienes están cerca.
relacionados: [alexitimia, hiper-e-hiposensibilidad]
fuentes: [klein-2025, paula-ansiedad-2015, prizant-seres-humanos-unicos]
