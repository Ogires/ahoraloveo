termino: Ecolalia
en_ingles: echolalia
alias: [ecolalia inmediata, ecolalia demorada, scripting]
familia: social
que_es: >
  La ecolalia es repetir palabras o frases que se han oído a otras personas, en
  la tele o en una película. Puede ser justo después de oírlas o mucho tiempo más
  tarde. Es frecuente en el autismo: el DSM-5, el manual de diagnóstico, la
  incluye entre las conductas repetitivas. Y muchas veces no es repetir sin más,
  sino una forma de comunicarse.
como_se_ve: >
  Puede repetir vuestra pregunta en vez de contestarla, o saludar con una frase
  de su película favorita. El especialista en autismo Barry Prizant analizó más de
  mil repeticiones de niñas y niños pequeños. Vio que servían para muchas cosas:
  decir que sí, tomar el turno en una conversación, ensayar lo que iban a decir o
  calmarse. Una niña que él cuenta repetía «¡Tengo una astilla!» cada vez que
  estaba nerviosa, desde el día en que se clavó una en el recreo.
no_confundir_con: >
  Con no entender o con hablar sin sentido. Prizant recuerda que hace años se
  intentaba cortar la ecolalia, incluso con castigos, y que mandar callar solo
  desanima a la niña o al niño a comunicarse.
en_ninas: >
  AETAPI, la asociación española de profesionales del autismo, pide fijarse en
  las chicas con «ecolalia social». Son las que eligen a una compañera o a un
  personaje conocido y lo copian como estrategia. También señala a las niñas que
  imitan a otras de forma mecánica y poco espontánea. No hemos encontrado estudios
  que comparen la ecolalia entre niñas y niños.
que_hacer: >
  Prizant resume su consejo así: escuchad, observad y preguntaos por qué. Fijaos
  en cuándo repite cada frase: muchas familias acaban entendiendo qué quiere decir
  con ella. Para ayudarla a ir hacia un lenguaje propio, propone hablarle con
  frases sencillas, partir las que repite en trozos más cortos y añadir gestos,
  imágenes o palabras escritas. Con el tiempo, los ecos suelen disminuir, aunque
  pueden volver en momentos de estrés.
escenas:
  - edad: 4 años
    lugar: en la consulta de pediatría
    protagonista: nina
    texto: >
      Al terminar la revisión, la pediatra le enseña las pegatinas y le pregunta
      si quiere una. Ella señala la roja y contesta: «¿Quieres una pegatina?». En
      cuanto se la dan, se la pega en la camiseta.
  - edad: 6 años
    lugar: en el baño de casa
    protagonista: nino
    texto: >
      Antes de meterse en la bañera repite en voz baja «agua calentita, agua
      calentita», con la voz de la presentadora de su programa favorito. Lo hace
      siempre que algo le da un poco de miedo.
relacionados: [estereotipias, masking]
fuentes: [escap-2021, prizant-seres-humanos-unicos, aetapi-mujeres-tea]
revisado: 2026-11-05
