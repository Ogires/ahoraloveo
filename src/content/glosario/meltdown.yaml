termino: Meltdown
en_espanol: [crisis, crisis por sobrecarga]
familia: emociones
que_es: >
  Un meltdown es una reacción intensa que aparece cuando a una persona autista
  le llega más de lo que puede procesar. Pueden desbordarla el ruido, un cambio
  de planes, los nervios o no poder explicar lo que necesita. Durante un rato
  pierde el control de lo que hace. No es mala conducta ni algo que elija.
como_se_ve: >
  Puede gritar, llorar, dar patadas, golpear o morder. Muchas veces hay avisos
  antes: va de un lado a otro, repite la misma pregunta, se balancea o se queda
  muy quieta. Puede pasar, por ejemplo, en un supermercado lleno un sábado, con
  la música alta y un cambio de planes de última hora. Después suele quedar
  agotada. No todas las personas autistas estallan: algunas se encierran en sí
  mismas y dejan de responder.
no_confundir_con: >
  Una rabieta. La rabieta busca conseguir algo y suele parar cuando lo consigue.
  En un meltdown no hay nada que negociar: se calma con tiempo, cuando baja la
  sobrecarga. La psicóloga Isabel Paula insiste en distinguirlos, porque lo que
  ayuda en una rabieta puede empeorar un meltdown.
en_ninas: >
  AETAPI, la asociación española de profesionales del autismo, explica que
  muchas niñas y adolescentes autistas se muestran muy complacientes en el
  colegio y estallan en casa. Llegan desgastadas por la ansiedad acumulada y
  por el esfuerzo de camuflar. Por eso el colegio y la familia pueden ver a la
  misma niña de forma muy distinta. No les pasa a todas. Las fuentes que hemos
  consultado no comparan los meltdowns entre niñas y niños.
que_hacer: >
  La National Autistic Society, la asociación británica de autismo, recomienda
  quitar estímulos y dar tiempo: un sitio tranquilo, menos luz y menos ruido, y
  vuestra presencia cerca, sin juzgar. Podéis preguntarle con calma si está
  bien, contando con que tardará en responder. Después, ya en calma, apuntad qué
  pasó antes, durante y después de cada meltdown. Con el tiempo suelen aparecer
  patrones: horas, sitios o situaciones que la desbordan. Así es más fácil
  adelantarse.
relacionados: [masking]
fuentes: [nas-crisis, paula-ansiedad-2015, aetapi-mujeres-tea]
