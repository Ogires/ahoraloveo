termino: Alexitimia
alias: [alexithymia]
familia: emociones
que_es: >
  La alexitimia es la dificultad para reconocer las propias emociones,
  distinguirlas de las sensaciones del cuerpo y ponerles nombre. No forma parte
  del autismo en sí, pero lo acompaña a menudo. Una revisión de 15 estudios la
  encontró en la mitad de las personas autistas estudiadas, frente a 1 de cada
  20 personas no autistas.
como_se_ve: >
  Una niña puede decir que le duele la tripa cuando en realidad está nerviosa
  por un examen. O contestar «no sé» o «bien» cuando le preguntáis cómo está,
  aunque lleve toda la tarde irritable. No es que no sienta: le cuesta saber
  qué siente y explicarlo.
no_confundir_con: >
  Con no tener emociones. Las personas con alexitimia tienen emociones; lo que
  les cuesta es reconocerlas y nombrarlas. Y no todas las personas autistas la
  tienen: según la misma revisión, la otra mitad no.
en_ninas: >
  Sin datos sobre niñas. La revisión reunió estudios con adolescentes y
  adultos, en su mayoría varones, y no pudo comparar por sexo. Todavía no
  sabemos si en las niñas autistas es más o menos frecuente.
que_hacer: >
  Fijaos en si los dolores de tripa o de cabeza aparecen antes de situaciones
  que le cuestan, como un examen o un cumpleaños. Apuntarlo os ayudará a
  explicárselo a su pediatra, que es quien puede descartar otras causas.
fuentes: [kinnaird-2019]
revisado: 2026-11-03
