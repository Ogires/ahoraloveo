termino: Alexitimia
en_ingles: alexithymia
familia: emociones
que_es: >
  La alexitimia es la dificultad para reconocer las propias emociones,
  distinguir unas de otras y ponerles nombre. No forma parte del autismo en sí,
  pero lo acompaña a menudo. Una revisión de 15 estudios con adolescentes y
  adultos reunió 9 que contaban cuántas personas la tenían: la mitad de las
  personas autistas, frente a 1 de cada 20 no autistas.
como_se_ve: >
  En las más pequeñas es difícil de ver, porque a esas edades todas las
  criaturas están aprendiendo aún a ponerle nombre a lo que sienten. Más
  adelante puede notarse en que contesta «no sé» o «bien» cuando le preguntáis
  cómo está, aunque lleve toda la tarde irritable. O en que no distingue unas
  emociones de otras, y todo es «estoy mal». A veces cuenta con detalle lo que
  pasó en el patio, pero no cómo se sintió. No es que no sienta: le cuesta saber
  qué siente y explicarlo.
no_confundir_con: >
  Con no tener emociones. Las personas con alexitimia tienen emociones; lo que
  les cuesta es reconocerlas y nombrarlas. Y no todas las personas autistas la
  tienen: según la misma revisión, la otra mitad no.
en_ninas: >
  Sin datos sobre niñas. La revisión reunió estudios con adolescentes y
  adultos, en su mayoría varones, y no pudo comparar por sexo. No incluía niñas
  pequeñas: se mide con un cuestionario que cada persona responde sobre sí
  misma.
que_hacer: >
  Si os parece que le pasa a menudo, apuntad ejemplos concretos: qué ocurrió,
  qué dijo ella y qué visteis vosotros. Os servirán para hablarlo con su
  pediatra o con quien la atiende. Y si se queja de que le duele algo, que lo
  valore su pediatra: no deis por hecho que son nervios. Sobre qué apoyos
  funcionan mejor, la revisión que usamos dice que todavía hace falta
  investigar.
fuentes: [kinnaird-2019]
revisado: 2026-11-05
