orden: 1
titulo: Os surge una duda
que_pasa: >
  Muchas familias empiezan a preocuparse entre los 18 y los 24 meses. A menudo,
  lo primero que llama la atención es que tarda en hablar, que apenas señala o
  que no se gira cuando la llamáis por su nombre. Ninguna de estas cosas, por sí
  sola, quiere decir que sea autismo. En las niñas las señales suelen ser más
  sutiles, así que la duda puede llegar más tarde.
que_hacer: >
  Apuntad lo que veis, con ejemplos y en qué situaciones pasa, y contádselo a su
  pediatra. La guía británica NICE pide a los profesionales que se tomen siempre
  en serio la preocupación de la familia, aunque otras personas no la compartan.
