orden: 6
titulo: El informe y después
que_pasa: >
  Al terminar, el equipo os explica las conclusiones en persona, también si no se
  llega a un diagnóstico de autismo. Después recibís un informe escrito con lo que
  han encontrado, en qué se basan y qué apoyos recomiendan. Si el resultado no
  está claro, lo habitual es seguir observando y, si hace falta, pedir una
  segunda opinión.
quien: El equipo que hizo la evaluación.
que_hacer: >
  Es lógico no poder asimilarlo todo el primer día. La guía ESCAP recomienda una
  cita de seguimiento para hacer preguntas, cuando hayáis tenido tiempo de
  pensar. Pedidla si no os la ofrecen, y llevad apuntado lo que no hayáis
  entendido del informe.
