orden: 2
titulo: Lo habláis con pediatría
que_pasa: >
  En las revisiones de salud infantil, pediatría sigue el desarrollo de cada niña
  y cada niño hasta los 36 meses. Observa cómo se mueve, cómo se comunica y cómo
  juega, os pregunta por lo que veis en casa y, a veces, usa cuestionarios.
  PrevInfad, el grupo de prevención de la pediatría de atención primaria, avisa
  de que ninguna escala sirve sola. Se combina con lo que se observa y con lo
  que cuenta la familia.
quien: Pediatría de vuestro centro de salud.
que_hacer: >
  Llevad a la consulta lo que habéis apuntado. Si algo os preocupa, decidlo con
  claridad: lo que contáis es una de las piezas del seguimiento.
fuentes: [previnfad-tea]
