orden: 5
titulo: La evaluación
que_pasa: >
  El diagnóstico lo hace un equipo de varios profesionales. Os preguntan por su
  desarrollo desde que nació, la observan jugando y hablando, y piden información
  a otras personas que la conocen bien, como su profesorado. Ninguna prueba basta
  sola: el diagnóstico sale de todo lo que reúnen y del criterio clínico. Y el
  objetivo no es solo ponerle nombre, sino saber qué apoyos necesita.
quien: >
  Profesionales de medicina, como psiquiatría o pediatría, y de psicología. A
  veces también de logopedia, neurología o terapia ocupacional.
que_hacer: >
  Contad lo que veis en casa con ejemplos concretos, también lo que os parezca
  pequeño. En las niñas las señales pueden ser más sutiles, y la guía ESCAP pide
  no descartar el diagnóstico demasiado pronto: a veces hacen falta varias
  sesiones.
herramientas: [ados-2, adi-r, pruebas-de-desarrollo]
