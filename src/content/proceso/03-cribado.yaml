orden: 3
titulo: El cribado
que_pasa: >
  Si hay motivos para mirarlo con más detalle, pediatría puede pasaros un
  cuestionario de cribado. Son preguntas sobre el día a día que suelen llevar
  entre 5 y 10 minutos. Sirven para saber si conviene una evaluación, no para
  diagnosticar. Un resultado positivo puede deberse a otras dificultades del
  desarrollo, y uno negativo no descarta el autismo.
quien: Pediatría. Según el cuestionario, lo responde la familia o el profesorado.
que_hacer: >
  Preguntad qué cuestionario es, qué significa el resultado y qué pasa después.
  Si sale negativo pero seguís viendo cosas que os preocupan, decidlo: PrevInfad
  recomienda seguir vigilando y repetir el cuestionario al menos hasta los 36
  meses.
