titulo: 'Los criterios: DSM-5 y CIE-11'
parrafos:
  - >
    Las pruebas no diagnostican por sí solas. Con todo lo que reúne, el equipo
    decide si se cumplen los criterios de uno de los dos manuales de diagnóstico.
    El DSM-5 es el de la Asociación Americana de Psiquiatría, y la CIE-11, el de
    la Organización Mundial de la Salud (OMS). La guía ESCAP explica que los dos
    describen el autismo de forma muy parecida. La guía NICE pide diagnosticar
    con uno de ellos, con toda la información y con el criterio clínico.
  - >
    Los dos manuales agrupan las señales en dos bloques: la comunicación y la
    relación con los demás, y los comportamientos e intereses repetitivos o muy
    rígidos. Son las dos primeras columnas de la tabla de abajo. El DSM-5 cuenta
    también lo sensorial, como molestarse mucho con un ruido o parecer no notar
    el dolor; la CIE-11, no. Las señales tienen que venir de la primera infancia
    y afectar a su día a día. Según el DSM-5, a veces no se notan del todo hasta
    que la vida social le pide más de lo que puede dar.
  - >
    Si se confirma, el diagnóstico se llama trastorno del espectro autista (TEA).
    Con el DSM-5, el informe indica además un nivel de apoyo, del 1, que necesita
    algo de apoyo, al 3, que necesita un apoyo muy sustancial. En España también
    se les llama grados: el grado 2 es el nivel 2. La guía ESCAP avisa de
    que el manual no explica bien qué significa cada nivel, y la CIE-11 no los
    usa. Con los dos, el informe puede decir también si hay discapacidad
    intelectual y cómo es su lenguaje.
  - >
    Desde el DSM-5, el Asperger ya no es un diagnóstico aparte: quien lo tenía
    pasa a tener un diagnóstico de TEA. En 2022 salió una revisión del manual, el
    DSM-5-TR. Para el autismo solo aclaró una cosa: en el bloque de la
    comunicación y la relación con los demás hacen falta las tres dificultades
    que describe, no una. Y, como recuerda la guía ESCAP, estos manuales
    clasifican los trastornos, no a las personas.
que_hacer: >
  Preguntad con qué manual se ha hecho el diagnóstico y qué quiere decir cada
  detalle del informe, también el nivel de apoyo. Ese nivel o grado no tiene nada
  que ver con el grado de discapacidad, que se da en porcentaje, ni con el grado
  de dependencia, que va del I al III. Si los necesitáis, se piden aparte, y los
  valoran otros equipos. Si no llega a cumplir todos los criterios pero tiene
  dificultades, la guía NICE pide valorar igualmente, según su perfil, a qué
  servicios derivarla.
