titulo: Lo que hace el colegio
parrafos:
  - >
    A veces quien nota algo primero es el profesorado. La guía ESCAP explica que
    las maestras y los maestros pueden ser una fuente clave de información, sobre
    todo donde es habitual ir a la escuela desde los 2 años. Ven a vuestra hija o
    hijo junto a otras niñas y niños de su edad, así que pueden notar sus puntos
    fuertes y sus dificultades y orientaros hacia una evaluación. La guía NICE añade que algunas señales no
    se notan hasta que cambian las circunstancias, por ejemplo al empezar la
    escuela infantil o primaria.
  - >
    El colegio puede hacer su propia valoración. La LOE, la ley de educación,
    dice que la hacen profesionales especialistas, lo antes posible, y que tienen
    que escucharos e informaros. Cada comunidad autónoma decide cómo se hace. Esta
    valoración no es el diagnóstico de autismo: busca qué barreras encuentra en el
    colegio y qué apoyos necesita para aprender y participar. Y, según la LOE, la
    atención tiene que empezar en cuanto se identifica esa necesidad.
  - >
    Las dos vías se pueden recorrer a la vez. La guía NICE recomienda que el
    equipo que hace la evaluación del diagnóstico pida un informe al colegio,
    con vuestro permiso. En las niñas, además, el colegio y la casa pueden ver cosas muy
    distintas. AETAPI explica que muchas pasan desapercibidas en la edad escolar,
    también con muy buenas notas. Algunas, desgastadas por la ansiedad y el
    [camuflaje](/glosario/masking/), se muestran muy complacientes en el colegio
    y explotan en casa. Otras veces es el profesorado quien ve lo que en casa no
    aparece.
que_hacer: >
  Si el colegio os cuenta que ha notado algo, pedid que os expliquen qué ha visto
  y en qué momentos, y contadles lo que veis en casa. Podéis llevar lo que os
  digan a la consulta de pediatría. Si os proponen una valoración, preguntad para
  qué sirve y cuándo os darán los resultados. La LOE dice que las familias
  tienen que participar en las decisiones sobre su escolarización.
comunitat_valenciana:
  parrafos:
    - >
      En los colegios públicos y concertados, primero el profesorado de su
      clase, coordinado por la tutora o el tutor, detecta qué le cuesta y prueba
      medidas. Si no bastan, lo hablan con orientación. En los colegios públicos
      de infantil y primaria, orientación es un equipo con una orientadora o un
      orientador y el personal de apoyo especializado. En secundaria, es el
      departamento de orientación. Juntos deciden qué medidas probar y cuándo
      revisarlas, o piden una evaluación sociopsicopedagógica. Para pedirla, os
      tienen que explicar los motivos y necesitan vuestra conformidad por
      escrito.
    - >
      La evaluación la coordina orientación, con entrevistas y observándola en
      clase, en el recreo y en el comedor. Busca las barreras que encuentra y sus
      puntos fuertes, sin poner etiquetas. El informe tiene que estar en 30 días
      naturales como máximo, salvo un motivo justificado. Os explican las
      conclusiones, os piden vuestra opinión y tenéis derecho a una copia. El
      informe dice si tiene necesidades específicas de apoyo educativo y propone
      medidas, apoyos y un grado de apoyo del 1 al 3. Ese grado depende del apoyo
      que necesita en el colegio y de cuánto tiempo a la semana: no es el
      [nivel del diagnóstico](/diagnostico/#criterios).
    - >
      Las unidades especializadas de orientación tienen personal dedicado al
      autismo, que asesora a los colegios y, cuando hace falta, interviene en la
      evaluación. Para menores de 6 años hay además un protocolo de 2024. Si la
      duda surge en la escuela infantil, antes de los 3 años, os propondrán ir a
      pediatría. De 3 a 6 años, el colegio pone medidas y, si hace falta, también
      os propone pediatría.
    - >
      Si ya va a un centro de atención temprana (CDIAT) y va a empezar el
      colegio, el CDIAT os informará de la valoración que hace orientación
      antes. Se hace con vuestra opinión y con el informe del CDIAT. Después,
      por lo general, el CDIAT la acompaña durante el primer trimestre. Si el
      colegio ya le da los apoyos educativos especiales que necesita, el CDIAT
      deja de atenderla, para no duplicar la atención. Puede seguir yendo,
      coordinado con el colegio, cuando hace falta trabajar a la vez: por
      ejemplo, si la familia necesita apoyo para fomentar su desarrollo y su
      autonomía.
