mito: Es una rabieta
variantes:
  - Se porta mal
  - Lo hace para llamar la atención
  - Le falta mano dura
dato: >
  Lo que parece una rabieta puede ser un meltdown: una reacción a algo que la
  desborda, que no elige y que no se calma negociando.
por_que: >
  La NAS, la asociación británica de autismo, explica que un meltdown es una
  reacción intensa cuando algo desborda por completo a la persona, que pierde el
  control durante un rato. No es una rabieta ni portarse mal. Ambitious about
  Autism, una organización británica dedicada a niños y jóvenes autistas, añade
  que no se hace a propósito ni para llamar la atención. Suele llegar cuando el
  estrés se ha ido acumulando, aunque algo concreto sea la gota que colma el
  vaso. La psicóloga Isabel Paula insiste en distinguirlos, porque lo que ayuda
  en una rabieta y en una crisis es muy distinto, y confundirlas puede empeorar
  la situación.
de_donde_viene: >
  La NAS reconoce que a mucha gente le cuesta distinguir un meltdown de una
  rabieta, porque desde fuera pueden parecerse. Además, AETAPI explica que
  muchas niñas autistas, desgastadas por la ansiedad y el esfuerzo de camuflar,
  se muestran muy complacientes en el colegio y estallan en casa. Por eso el
  colegio y la familia pueden ver a la misma niña de forma muy distinta. Ambitious
  about Autism cuenta que, cuando se toma por mal comportamiento, niñas, niños
  y jóvenes autistas se sienten incomprendidos, agotados y sin apoyo.
que_hacer: >
  Ambitious about Autism recomienda verlo como una señal de que está
  desbordada, no como algo que haya que castigar. En el momento, ayuda más
  bajar las exigencias, darle espacio, hablarle con frases sencillas y que se
  sienta segura que intentar razonar con ella. Después, ya en calma, la NAS
  aconseja apuntar qué pasó antes, durante y después: con el tiempo suelen
  aparecer patrones. Y si en el colegio lo toman por mal comportamiento, podéis
  mandarles el enlace a esta página.
relacionados: [meltdown]
fuentes: [nas-crisis, ambitious-meltdowns-shutdowns, paula-ansiedad-2015, aetapi-mujeres-tea]
