mito: Hay una epidemia de autismo
variantes:
  - Antes no había tantos niños autistas
dato: >
  Hay más diagnósticos que antes sobre todo porque el autismo se reconoce mejor,
  con criterios más amplios y más conocimiento.
por_que: >
  Autismo España explica que el aumento de diagnósticos de las últimas décadas
  se debe sobre todo a tres cosas. Son unos criterios de diagnóstico más
  amplios, más conocimiento entre profesionales y en la sociedad, y mejor acceso
  a los servicios. Un estudio de 2011 midió cuántas personas autistas había entre los
  adultos de Inglaterra: casi 1 de cada 100, como en la infancia. Y no había
  menos entre las personas mayores, que es lo que se esperaría si el autismo
  estuviera aumentando. La OMS calcula que, en el mundo, 1 de cada 127 personas
  es autista, aunque la cifra cambia mucho de un estudio a otro. En Suecia, el
  estudio que siguió a 2,8 millones de personas vio que los diagnósticos
  crecían en cada periodo, y que las chicas se iban poniendo al día.
de_donde_viene: >
  Las cifras de ahora y las de hace unas décadas no cuentan lo mismo, porque los
  criterios del diagnóstico se han ampliado. El estudio inglés encontró además
  que muchas personas adultas autistas siguen sin estar reconocidas. La palabra
  «epidemia» volvió a sonar en 2025, cuando el secretario de Salud de Estados
  Unidos anunció que buscaría su causa. Autismo España lo rechazó: hablar de
  epidemia no solo es incorrecto, sino que alarma y estigmatiza.
que_hacer: >
  Si os dicen que ahora hay muchos más, podéis contestar que lo que ha cambiado
  es cómo se reconoce el autismo. Y que las chicas, a las que antes se
  diagnosticaba menos y más tarde, están empezando a recibir su diagnóstico. Si
  queréis saber más, en «El autismo es cosa de chicos» tenéis las cifras.
