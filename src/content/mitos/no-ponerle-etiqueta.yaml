mito: Mejor no ponerle la etiqueta
variantes:
  - Si la diagnostican, la van a encasillar
  - Mejor esperar a que sea mayor
dato: >
  El diagnóstico pone nombre a lo que ya le pasa y puede abrir la puerta a
  apoyos; a quién contarlo se decide en familia.
por_que: >
  La NAS, la asociación británica de autismo, resume lo que una evaluación
  puede dar a una familia. Ayuda a entender mejor a vuestra hija para apoyarla,
  a saber por qué le cuestan algunas cosas y a acceder a los apoyos. También
  confirma que no es culpa de vuestra forma de criarla ni de ella. En un estudio
  con 14 mujeres diagnosticadas de adultas, 8 decían que su vida habría sido más
  fácil con un diagnóstico antes. Hasta entonces, a lo que les costaba se le
  ponían otras etiquetas, como vagas o desobedientes. En otro, con 11 mujeres
  diagnosticadas pasados los 40, a varias el diagnóstico les ayudó a dejar de
  criticarse, aunque les dolió que llegara tan tarde.
de_donde_viene: >
  El miedo a los prejuicios es real. La NAS recoge que algunas personas temen
  que un diagnóstico les cierre puertas o les traiga prejuicios, y recuerda que
  normalmente no hace falta contárselo a nadie. Otra parte del miedo es pensar
  que el diagnóstico marca su futuro. La guía ESCAP explica que no es así: un
  diagnóstico en la primera infancia no puede predecir de forma fiable cómo le
  irá después.
que_hacer: >
  Separad dos decisiones: pedir una evaluación, que no os obliga a nada más, y
  contarlo. Si estáis pensando en esperar, la guía ESCAP avisa de que en las
  niñas el diagnóstico tardío y la falta de apoyos aumentan el riesgo de
  problemas emocionales. Y el diagnóstico no es el certificado de discapacidad
  ni el grado de dependencia: se piden aparte, como explicamos en
  [los criterios del diagnóstico](/diagnostico/#criterios). Sobre contarlo, la
  NAS explica que con las niñas pequeñas decide la familia si contarlo, cuándo y
  cómo, y que con las mayores conviene decidirlo con ellas. Por ejemplo, puede
  querer que lo sepa su maestra, pero todavía no sus compañeras.
relacionados: [presentacion-femenina, masking]
fuentes: [nas-deciding, nas-disclosing, bargiela-2016, leedham-2020, escap-2021]
