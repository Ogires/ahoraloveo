mito: El autismo se cura
variantes:
  - Con una dieta sin gluten se le quitará
  - Hay un tratamiento que lo cura
dato: >
  El autismo no es una enfermedad y no tiene cura; lo que ayuda son los apoyos
  adaptados a cada persona.
por_que: >
  El NHS, la sanidad pública británica, explica que con el autismo se nace, que
  no es una enfermedad y que no tiene tratamiento ni cura. La NAS, la
  asociación británica de autismo, añade que no hay ninguna prueba científica de
  que algún producto o terapia lo cure. La guía ESCAP recoge que no existe
  ningún medicamento para las características principales del autismo. Y que
  los tratamientos llamados alternativos, como las dietas que quitan alimentos o
  los suplementos de omega-3, no tienen cabida en su tratamiento. Lo que sí
  ayuda, según la OMS, son los apoyos con base científica: pueden mejorar la
  comunicación, el trato con los demás y el bienestar.
de_donde_viene: >
  La NAS explica que la vida puede ser muy difícil para las familias justo antes
  y después del diagnóstico, cuando hay muchas dudas y cuesta encontrar apoyo.
  Eso las deja más expuestas a información falsa o engañosa. Y hay quien se
  aprovecha: la NAS avisa de productos que se venden por internet como «curas»,
  como el MMS, que es lejía. También recuerda que muchas personas autistas
  sienten su autismo como parte de quiénes son, y que les ofende que se hable de
  curarlo con terapias sin pruebas.
que_hacer: >
  Si alguien os ofrece una cura, desconfiad: la NAS pide no usar productos como
  el MMS en ningún caso, porque pueden hacer mucho daño. Antes de decidir un
  apoyo o una terapia, buscad información fiable y preguntad a profesionales con
  formación en autismo. Y si os lo comentan con buena intención, podéis
  contestar que no hay nada que curar, pero sí mucho que apoyar.
