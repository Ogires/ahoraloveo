mito: Las vacunas causan autismo
variantes:
  - La triple vírica provoca autismo
  - Empezó a cambiar después de vacunarla
dato: >
  Los estudios más grandes, con más de un millón de niñas y niños, no encuentran
  ninguna relación entre las vacunas y el autismo.
por_que: >
  La triple vírica es la vacuna del sarampión, las paperas y la rubéola. La OMS
  explica que muchos estudios, hechos durante años y de formas distintas, han
  demostrado que no causa autismo. Y que tampoco lo causan otras vacunas de la
  infancia, ni el tiomersal o el aluminio que llevan algunas. Una revisión de
  2014 juntó estudios con más de 1,2 millones de niñas y niños, y no vio
  relación entre las vacunas y el autismo. En 2019, un estudio con
  657.461 niñas y niños de Dinamarca comparó a quienes habían recibido la triple
  vírica con quienes no. El autismo no era más frecuente en los vacunados, ni
  siquiera en quienes tenían un hermano o una hermana autista.
de_donde_viene: >
  En 1998, un antiguo cirujano inglés, Andrew Wakefield, publicó un artículo que
  relacionaba la triple vírica con el autismo. Después se supo que había
  falseado los datos y que lo financiaban abogados que querían demandar a los
  fabricantes de vacunas. La revista The Lancet retiró el artículo en 2010, y
  Wakefield perdió su licencia de médico. Pero las noticias ya habían asustado a
  muchas familias: en todo el mundo se vacunó menos y hubo brotes de
  enfermedades graves. Además, la guía ESCAP cuenta que hace años se
  describieron cambios bruscos entre el año y los 2 años, y se pensó, por error,
  que eran por las vacunas. Después se vio que esos cambios bruscos son poco
  frecuentes, y que muchos de esos niños ya tenían antes dificultades para
  comunicarse y relacionarse.
que_hacer: >
  La NAS, la asociación británica de autismo, recuerda que la triple vírica es
  segura, así que podéis seguir el calendario de vacunas con tranquilidad. Si
  tenéis dudas sobre una vacuna, preguntad en la consulta de pediatría o de
  enfermería. Y si notáis cambios en su desarrollo, contadlos en la consulta,
  haya habido una vacuna o no.
