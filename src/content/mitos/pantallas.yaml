mito: Es por las pantallas
variantes:
  - Se ha vuelto autista por la tablet
  - Si no hubiera tantas pantallas, no le pasaría
dato: >
  No hay pruebas de que las pantallas causen autismo: los estudios ven que van
  juntos, pero no que una cosa cause la otra.
por_que: >
  Una revisión de 2026 reunió 11 estudios con casi 125.000 participantes, sobre
  todo de infantil, y pocos con autismo diagnosticado. Más pantallas a edades
  tempranas iban a menudo con rasgos parecidos a los del autismo, pero eso no
  demuestra que los causen. En un estudio australiano con 5.107 niñas y niños,
  los autores concluyen que la relación probablemente no es de causa y efecto,
  aunque su método tiene límites. En un gran estudio japonés, la relación
  apareció en los niños y no en las niñas, aunque solo 79 niñas tenían el
  diagnóstico. Y puede ser al revés: en otro estudio japonés, sin niñas ni
  niños autistas, los que menos se comunicaban con 1 y 2 años veían después más
  la tele.
de_donde_viene: >
  Se nace autista, como contamos en [¿Qué hicimos mal?](/mitos/que-hicimos-mal/).
  La guía ESCAP recuerda que los rasgos del autismo están desde la primera
  infancia, aunque a veces no se noten claramente hasta más tarde. Son los
  mismos años en que llegan las pantallas, y dos cosas que coinciden en el
  tiempo parecen una la causa de la otra. A eso se suma el «autismo virtual»
  del que se habla en redes: la revisión de 2026 recuerda que no es un
  diagnóstico reconocido.
que_hacer: >
  Si os preocupa su desarrollo, quitar la tablet y esperar no es la respuesta:
  pedid una valoración. La revisión de 2026 encontró que las mejoras al reducir
  pantallas se basaban sobre todo en casos sueltos, sin comparar con otros
  niños. Lo que sí puede ayudar es dejarlas fuera de la rutina de ir a dormir.
  En un estudio con 101 niñas y niños autistas, quienes tenían la tele o los
  videojuegos en su rutina de dormir tardaban más en dormirse. De media, 40
  minutos frente a 16. Y no os culpéis por las horas de pantalla: no hay nada que demuestre que
  causen autismo.
