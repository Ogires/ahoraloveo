mito: Su autismo es leve
variantes:
  - Es solo un poquito autista
  - Como es leve, no necesita apoyos
dato: >
  En el DSM-5, el grado 1 se llama «necesita ayuda»: que su autismo se note
  poco no quiere decir que le cueste poco.
por_que: >
  El DSM-5, uno de los manuales con los que se diagnostica, describe tres
  grados según cuánta ayuda hace falta. La guía de la SEPEAP, la sociedad
  española de pediatría extrahospitalaria, recoge que el más bajo no se llama
  «leve», sino «necesita ayuda». Y la guía ESCAP avisa de que el manual no
  aclara cuánto es «un poco» de apoyo. Un estudio de 2026 con 15.450 niñas y
  niños de Estados Unidos encontró que menos de la mitad tenía el grado
  anotado, y que cada zona lo usaba de forma muy distinta. Otro, con 2.225 niñas
  y niños australianos de 1 a 18 años, vio que el cociente intelectual predice
  mal cómo se desenvuelven en el día a día. En los que no tenían discapacidad
  intelectual, su día a día iba claramente por debajo de lo que haría esperar
  su inteligencia.
de_donde_viene: >
  Durante años, a las personas autistas sin discapacidad intelectual se las
  llamó «de alto funcionamiento», y se dio por hecho que les iría mejor en el
  día a día. Los autores del estudio australiano piden dejar de usar ese
  término cuando se basa solo en el cociente intelectual. Además, el espectro
  se imagina a menudo como una línea que va de leve a grave. La NAS, la
  asociación británica de autismo, explica que no es así: una persona autista
  puede ser experta en un tema y que le cueste acordarse de lavarse los
  dientes. Y el estudio estadounidense recuerda que los grados no se
  comprobaron antes de publicarse el manual.
que_hacer: >
  Cambiad la pregunta: en vez de cuánto autismo tiene, qué le cuesta y qué le
  ayuda. En el colegio o en la consulta, ayuda más contar situaciones concretas
  que dar el grado: el comedor, el patio, los cumpleaños o cómo llega a casa. Que se note poco tampoco quiere decir que no le pese.
  ESCAP explica que el diagnóstico tardío, la falta de apoyos y el esfuerzo por
  parecer como las demás aumentan el riesgo de problemas emocionales en las
  niñas. Y si el informe da un grado, preguntad qué quiere decir. Lo explicamos
  en [los criterios del diagnóstico](/diagnostico/#criterios), y también por
  qué no es el grado de discapacidad ni el de dependencia.
relacionados: [presentacion-femenina, masking, discapacidad-intelectual]
fuentes: [sepeap-tea-2023, escap-2021, russell-2026, alvares-2020, nas-varying-support]
