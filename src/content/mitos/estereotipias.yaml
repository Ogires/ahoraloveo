mito: Aletear o balancearse son manías que hay que quitar
variantes:
  - Deja de mover las manos, que te van a mirar
  - Si no se lo corriges ahora, no se le quitará
dato: >
  Las estereotipias ayudan a muchas personas autistas a calmarse, a concentrarse
  o a expresar alegría; si no hacen daño, no hace falta quitarlas.
por_que: >
  La NAS, la asociación británica de autismo, explica para qué sirven. Muchas
  personas autistas repiten movimientos, como aletear o dar vueltas, para
  calmarse, para sentir algo que les gusta o para expresar alegría. Todo el
  mundo hace algo parecido, como jugar con un boli o enrollarse el pelo, pero
  las personas autistas suelen hacerlo más. En un estudio con 31 adultos
  autistas, contaron que les ayudaba a calmarse o a sacar emociones muy fuertes,
  y no querían tratamientos para quitárselas. Por eso la NAS concluye que, si no
  hacen daño, no hay motivo para impedirlas.
de_donde_viene: >
  Durante años no se entendía para qué servían, y se intentaba que las personas
  autistas dejaran de hacerlas para que parecieran menos autistas. Barry
  Prizant, especialista en autismo, cuenta que hace décadas incluso se
  castigaban. Según la NAS, muchas personas autistas lo viven como un
  camuflaje obligado, que puede traer ansiedad. En las niñas, además, a menudo
  se notan menos, y AETAPI recuerda que hacia los seis años algunas empiezan a
  controlarlas y a esconderlas.
que_hacer: >
  Fijaos en cuándo las hace y con qué fuerza: Prizant cuenta de una familia a la
  que le servían para saber cuánto estrés había tenido su hijo durante el día. Si alguna le hace daño, la NAS aconseja buscar qué la está agobiando y,
  si se puede, cambiarla por otra que le sirva igual. Quitársela sin más puede
  agobiarla todavía más. Prizant propone también cambiar lo que la rodea, con
  menos ruido y menos desorden.
relacionados: [estereotipias, masking]
fuentes: [nas-stimming, kapp-2019, prizant-seres-humanos-unicos, aetapi-mujeres-tea]
