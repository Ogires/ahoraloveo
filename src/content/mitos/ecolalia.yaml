mito: Repetir frases es hablar sin sentido
variantes:
  - Repite como un loro
  - Eso es que no entiende lo que dice
  - Hay que cortarle cuando repite
dato: >
  Repetir frases es muchas veces una forma de comunicarse: puede servir para
  decir que sí, tomar el turno, ensayar o calmarse.
por_que: >
  Repetir palabras o frases que se han oído se llama ecolalia, y la guía ESCAP
  la incluye entre las conductas repetitivas del autismo. Pero muchas veces no
  es repetir sin más. En un estudio pequeño de 1981, Barry Prizant grabó a 4
  niñas o niños en el colegio y en casa, y analizó más de mil repeticiones. Vio
  que eran mucho más que algo sin sentido: con ellas afirmaban lo que
  entendían, tomaban el turno en una conversación o ensayaban lo que iban a
  decir. Prizant explica también que, para muchas niñas y niños autistas,
  repetir es una forma de aprender a hablar.
de_donde_viene: >
  Desde fuera, una frase de una película en mitad de una conversación puede
  parecer que no viene a cuento. Prizant cuenta que, cuando empezó a trabajar,
  algunos profesionales la llamaban «habla tonta» y usaban técnicas duras para
  cortarla. Y explica que mandar callar no solo es inútil: desanima a la niña o
  al niño en su esfuerzo por comunicarse.
que_hacer: >
  Prizant resume su consejo así: escuchad, observad y preguntaos por qué.
  Fijaos en cuándo repite cada frase. Él cuenta de una niña que decía «¡Tengo
  una astilla!» cada vez que estaba nerviosa, desde el día en que se clavó una
  en el recreo. Con el tiempo, los ecos suelen ir a menos, aunque pueden volver
  en momentos difíciles.
relacionados: [ecolalia]
