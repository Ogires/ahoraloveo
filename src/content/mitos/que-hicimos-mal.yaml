mito: ¿Qué hicimos mal?
variantes:
  - Es por cómo la habéis criado
  - Fue algo del embarazo o del parto
  - Es por el paracetamol del embarazo
dato: >
  Se nace autista, y los genes tienen mucho que ver: no lo causa la forma de
  criar ni nada que pase después de nacer.
por_que: >
  El NHS, la sanidad pública británica, explica que con el autismo se nace y que
  no se sabe qué lo causa, aunque a veces se repite en una familia. La NAS, la
  asociación británica de autismo, va más allá: la mayoría de las personas
  autistas lo son por los genes que heredan. Según la NAS, solo dos cosas del
  embarazo hacen, por sí solas, el autismo mucho más probable. Son la rubéola de
  la madre en los tres primeros meses y el valproato, un medicamento contra las
  convulsiones. Las demás, como nacer antes de tiempo o que el padre
  sea mayor, no pueden causarlo por sí solas. Y nada de lo que pasa después de
  nacer puede hacer que alguien sea autista.
de_donde_viene: >
  A mediados del siglo XX, Leo Kanner y Bruno Bettelheim pensaron que el autismo
  podía deberse a una crianza fría, y culparon a las que llamaron «madres
  nevera». No tenían pruebas, pero la idea tuvo mucha influencia e hizo mucho
  daño, hasta que los estudios sobre los genes mostraron que era un error. Aun
  así, la NAS cuenta que algunas familias todavía se sienten culpadas, sobre
  todo al pedir apoyos. Lo del paracetamol viene de septiembre de 2025, cuando
  el Gobierno de Estados Unidos lo relacionó con el autismo. La NAS lo llama
  desinformación: un gran estudio sueco de 2024 y una revisión de 2025 no
  encontraron relación.
que_hacer: >
  Es habitual preguntarse si pudisteis hacer algo distinto. Pero con el autismo se
  nace, y que los genes tengan mucho que ver no hace culpable a nadie. La NAS
  recuerda que hablar del autismo como algo de lo que alguien tiene la culpa
  ofende a muchas personas autistas y a sus familias. Si os dicen que es por
  cómo la habéis criado, podéis mandar el enlace a esta página. Y si pensáis en
  otro embarazo, la NAS solo aconseja hablarlo con el médico si hay riesgo de
  rubéola o si se toma valproato.
