mito: El autismo es cosa de chicos
variantes:
  - Las niñas casi nunca son autistas
  - Por cada niña autista hay cuatro niños
dato: >
  Hay más chicos con diagnóstico de autismo, pero la diferencia es menor de lo
  que se creía, y muchas niñas lo reciben más tarde.
por_que: >
  La guía ESCAP, de la sociedad europea de psiquiatría infantil, recoge que en
  general se calcula que hay de 3 a 4 chicos autistas por cada chica. Pero la cifra cambia según cómo
  se cuente. Una revisión de 54 estudios, con casi 14 millones de personas,
  encontró unos 3 chicos por cada chica cuando se buscaba el autismo en toda la
  población. Si solo se contaba a quien ya tenía diagnóstico, salían más de 4.
  Un estudio sueco con casi 2,8 millones de personas vio que, hasta los 10 años,
  se diagnosticaba a unos 3 chicos por cada chica. Muchas chicas, en cambio,
  recibían el diagnóstico en la adolescencia: en 2022, a los 20 años, eran ya
  1,2 chicos por cada chica.
de_donde_viene: >
  La cifra de 4 chicos por cada chica se ha repetido mucho, y la revisión de 54
  estudios recuerda que se suele dar por buena. ESCAP explica que, en muchas
  niñas, las dificultades sociales y de comunicación son más sutiles, y que las
  pruebas de diagnóstico actuales no tienen en cuenta esas diferencias. La
  revisión apunta a que el diagnóstico pasa más por alto a las niñas: las que
  cumplen los criterios corren más riesgo de quedarse sin él. Y los autores del
  estudio sueco piden investigar por qué a ellas se las diagnostica más tarde.
que_hacer: >
  Si os dicen que es raro que una niña sea autista, podéis contestar que no es
  tan raro. En la infancia se diagnostica a una niña por cada 3 o 4 niños, y
  muchas lo reciben más tarde. Para consultarlo, no hace falta que vuestra hija
  se parezca a un niño autista. Si algo os llama la atención, contadlo en la
  consulta con ejemplos concretos: qué hace, dónde y con quién.
