mito: No parece autista
variantes:
  - Pero si te mira a los ojos
  - Es muy sociable y tiene amigas
  - En el cole va muy bien
dato: >
  Una niña autista puede mirar a los ojos, tener amigas e ir bien en el cole: en
  muchas niñas, las dificultades son más sutiles.
por_que: >
  La guía ESCAP, de la sociedad europea de psiquiatría infantil, explica que en
  muchas niñas autistas las dificultades sociales y de comunicación son más
  sutiles que en los chicos. Comparadas con ellos, tratan más de relacionarse y
  a menudo tienen una o dos amistades. Un estudio de 2025 siguió a 4.550 niñas
  y niños de 20 a 40 meses, la mayoría hermanos pequeños de niñas y niños
  autistas. Con las mismas dificultades de fondo, las niñas tenían menos
  problemas para mirar a los ojos que los niños. Además, hay quien se fuerza a
  mirar para encajar: en un estudio con 92 personas autistas, era una
  estrategia frecuente. Y AETAPI recuerda que muchas niñas pueden sacar muy
  buenas notas mientras sus dificultades pasan desapercibidas.
de_donde_viene: >
  Mucha gente tiene en la cabeza una imagen concreta del autismo. En el estudio
  con 92 personas autistas, algunas mujeres contaban que su diagnóstico
  sorprendía. No se parecían a la imagen de un hombre autista, bueno en
  matemáticas y que no mira a los ojos. ESCAP añade que las pruebas de
  diagnóstico actuales no tienen en cuenta las diferencias entre chicos y
  chicas. Los autores del estudio con niñas y niños pequeños sacan una
  consecuencia. Para llegar al diagnóstico, una niña tiene que diferenciarse de
  las otras niñas más de lo que un niño tiene que diferenciarse de los otros
  niños.
que_hacer: >
  Si os dicen que no parece autista, podéis contestar que en muchas niñas el
  autismo no se ve a simple vista. Fijaos también en lo que le cuesta, no solo
  en lo que hace bien: por ejemplo, mantener amistades estables o estar con un
  grupo distinto del de siempre. AETAPI recomienda que quien evalúa
  a una niña cuente con información del colegio y de la familia. Así que
  contad en la consulta lo que veis en casa, con ejemplos concretos, aunque en
  el cole os digan que va bien.
relacionados: [masking]
