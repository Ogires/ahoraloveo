mito: Prefiere estar sola
variantes:
  - No le interesa tener amigas
  - Le da igual estar con otras niñas
dato: >
  Muchas niñas autistas quieren tener amigas; lo que les cuesta es mantenerlas,
  y a veces necesitan estar a solas para descansar.
por_que: >
  La guía ESCAP explica que, comparadas con los niños, las niñas autistas tratan
  más de relacionarse, y que a menudo tienen una o dos amistades. En un estudio
  inglés con 46 adolescentes de colegios de educación especial, las chicas
  autistas tenían tantas ganas de tener amigas, y amistades tan buenas, como
  las demás chicas. Con los chicos autistas no pasaba lo mismo: mostraban menos
  interés por relacionarse. Otro estudio, con 102 adolescentes, vio que las
  chicas autistas tenían amistades parecidas a las de las demás, pero más
  conflictos, y que les costaba más resolverlos. AETAPI describe niñas que se
  relacionan aparentemente bien, pero a las que les cuesta intimar, o que van
  de un grupo a otro sin llegar a tener amigas estables. Y en adultos, un
  estudio vio que las personas autistas se sienten más solas, y que a la vez
  necesitan ratos a solas para recuperarse tras estar con gente.
de_donde_viene: >
  Desde fuera, una niña que juega sola en el patio o que se encierra en su
  cuarto al volver del cole parece no querer compañía. Pero las personas
  autistas del estudio con adultos sentían a la vez el dolor de la soledad y la
  necesidad de estar a solas. Además, las relaciones con personas no autistas
  cuestan por los dos lados. En un experimento con 72 adultos, una historia
  pasaba igual de bien entre personas autistas que entre no autistas, y peor
  en los grupos mixtos. Lo explicamos en la ficha de la
  [doble empatía](/glosario/doble-empatia/).
que_hacer: >
  Ofrecedle planes con otras niñas sin forzarla, y respetad sus ratos a solas:
  pueden ser para descansar, no para alejarse. No midáis por cuántas amigas
  tiene, porque muchas niñas autistas tienen una o dos. Sus intereses pueden
  ser un buen camino: según la NAS, las personas autistas cuentan que les
  ayudan a hacer amistades con quien los comparte. Y preguntadle cómo la
  tratan. En un estudio con 105 adolescentes autistas de 13 a 17 años, cuantos
  más rumores, exclusiones o vacíos recibían las chicas de sus compañeros, más
  ansiedad tenían.
