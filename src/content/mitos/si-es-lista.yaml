mito: Si es lista, no es autista
variantes:
  - Es demasiado lista para ser autista
  - El autismo va con discapacidad intelectual
dato: >
  Ser lista no descarta el autismo: la mayoría de las niñas y niños autistas
  no tienen discapacidad intelectual.
por_que: >
  En el último informe de los CDC, la agencia de salud pública de Estados
  Unidos, 4 de cada 10 niñas y niños autistas de 8 años tenían discapacidad
  intelectual. Era casi igual en ellas que en ellos, y más de un tercio tenía
  una inteligencia media o alta. En el informe anterior, a quienes no tenían
  discapacidad intelectual se les diagnosticaba unos 10 meses más tarde. Una
  revisión sobre el autismo en mujeres y niñas explica que el diagnóstico
  detecta peor a las chicas, sobre todo si no tienen discapacidad intelectual.
  Y la guía ESCAP recoge que, en general, hay 3 o 4 chicos autistas por cada
  chica. Algunos estudios llegan a 8 o 9 cuando la inteligencia es media o
  alta, y la guía añade que muchas se quedan sin diagnosticar.
de_donde_viene: >
  La NAS, la asociación británica de autismo, explica que muchas mujeres y
  niñas se han quedado sin diagnóstico por ideas antiguas sobre el autismo. Una
  es la del genio de las matemáticas, que contamos en
  [el mito de la memoria prodigiosa](/mitos/memoria-prodigiosa/). En un estudio
  con 14 mujeres diagnosticadas de adultas, una recordaba a su profesora de
  apoyo diciéndole que era demasiado mala en matemáticas para ser autista. Otra
  idea es que, si va bien en clase, no le cuesta nada. La NAS avisa de que, en
  las niñas, las buenas notas pueden tapar lo que les cuesta en otras cosas.
que_hacer: >
  Si veis señales, pedid que la valoren aunque vaya bien en el cole. En la
  consulta, contad lo que no se ve en las notas: cómo llega a casa, qué le
  cuesta en el patio o cuánto esfuerzo le supone el día. Y si tiene altas
  capacidades, tampoco lo descarta: se puede ser las dos cosas. Una revisión de
  2022 recuerda que a estas niñas y niños se les entiende mal a menudo, y que
  se quedan sin el apoyo social y emocional que necesitan.
relacionados: [discapacidad-intelectual, presentacion-femenina, masking]
