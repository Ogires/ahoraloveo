mito: Si juega a las muñecas, no es autista
variantes:
  - Tiene mucha imaginación
  - Juega a las cocinitas como cualquier niña
dato: >
  Jugar a las muñecas no descarta el autismo: en una niña, más que a qué juega,
  importa cómo juega.
por_que: >
  La guía NICE, la de referencia en el Reino Unido, pide no descartar el
  autismo porque la familia cuente que juega a hacer como que. La guía ESCAP
  explica que las niñas autistas suelen tener un juego más imaginativo que los
  niños autistas, y AETAPI dice lo mismo. AETAPI avisa además de que jugar a
  las muñecas o a las cocinitas puede parecer juego simbólico y, de cerca, ser
  repetitivo y poco flexible. Habla de niñas que pasan casi todo
  el rato ordenando los objetos y preparando la escena, más que jugando. Eso no
  quiere decir que el juego de ficción no les cueste. Una revisión de 2003
  encontró que a las personas autistas les cuesta mucho inventarlo por su
  cuenta, y menos cuando el juego está más guiado.
de_donde_viene: >
  Durante mucho tiempo se ha unido el autismo a la falta de imaginación. La
  revisión de 2003 recuerda que el diagnóstico se basaba, en parte, en
  problemas de imaginación. Y la guía NICE incluye, entre las señales a tener
  en cuenta en infantil, un juego de ficción escaso o poco variado. Pero AETAPI
  explica que las muñecas, las cocinitas o jugar a las casitas se ven como
  juegos propios de niñas, y que por eso pueden parecer más simbólicos de lo
  que son.
que_hacer: >
  Mirad cómo juega, no solo a qué. Por ejemplo, si acepta que la historia
  cambie, si deja que otra niña proponga, si hay turnos de verdad o si pasa el
  rato preparando la escena. AETAPI pide a los profesionales que se fijen justo
  en eso, así que contadlo en la consulta con un ejemplo concreto. Si le cuesta
  que cambien las cosas en el juego, puede que os sirva la ficha de
  [rigidez y rutinas](/glosario/rigidez-y-rutinas/). Y si le cuesta jugar a
  hacer como que, probad a proponerle qué hacer: con más guía, suele resultar
  más fácil.
relacionados: [rigidez-y-rutinas, presentacion-femenina]
