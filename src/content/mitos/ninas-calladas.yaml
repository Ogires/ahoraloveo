mito: Todas las niñas autistas son calladas y tímidas
variantes:
  - Todas las niñas autistas camuflan
  - La niña autista es la callada de la clase
dato: >
  Las niñas autistas son muy distintas entre sí: unas parecen tímidas, otras
  son muy desinhibidas, y no todas camuflan.
por_que: >
  AETAPI explica que las niñas autistas pueden ser muy distintas entre sí. Algunas se
  portan muy bien y parecen tímidas, y como eso se espera de una niña, no
  llaman la atención de docentes ni de profesionales sanitarios. A otras las
  guía una amiga, que les va mostrando qué hacer. Y otras son muy desinhibidas,
  aunque, si se observa con atención, su forma de relacionarse no encaja con la
  situación. Sobre el masking (el camuflaje), una revisión de 29 estudios encontró que, de
  media, las mujeres y las niñas autistas camuflan más que los hombres y los
  niños autistas. Pero la diferencia es de pequeña a moderada, y también hay
  chicos que camuflan.
de_donde_viene: >
  La imagen tiene una parte de verdad. AETAPI recuerda que muchas niñas y
  adolescentes autistas se esfuerzan por ocultar lo que haría notar su autismo.
  La revisión de 29 estudios apunta a que el masking puede explicar en parte
  que a ellas se las diagnostique más tarde. Además, los estudios sobre
  masking en adultos se han hecho sobre todo con mujeres con estudios
  universitarios y diagnosticadas ya de adultas.
que_hacer: >
  Fijaos en cómo se relaciona vuestra hija, sea tímida, muy desinhibida o vaya
  siempre con una amiga. Si algo os llama la atención, contadlo en la consulta
  con ejemplos concretos: qué hace, dónde y con quién. Y si os dicen que no
  puede ser autista porque no es tímida, podéis mandar el enlace a esta página.
relacionados: [masking]
fuentes: [aetapi-mujeres-tea, cook-2021]
