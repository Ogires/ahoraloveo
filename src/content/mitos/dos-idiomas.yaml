mito: Es porque le habláis en dos idiomas
variantes:
  - El bilingüismo le retrasa el habla
  - Mejor habladle en un solo idioma
dato: >
  Hablarle en dos idiomas no causa autismo ni le retrasa más el lenguaje: si
  tiene dificultades, se notan en las dos lenguas.
por_que: >
  Se nace autista, como explica el NHS, el servicio de salud británico. Una
  revisión de 2018 reunió los 9 estudios que comparaban a niñas y niños
  autistas criados con uno o con dos idiomas. No encontró diferencias claras en
  el lenguaje, la inteligencia ni los rasgos del autismo, y concluye que no hay
  pruebas de que criarlos con dos idiomas les perjudique. Incluso apunta a una
  posible ventaja, por ejemplo en el vocabulario. En un estudio de Canadá con 75
  niñas y niños autistas de unos 4 años y medio, quienes oían dos idiomas no
  tenían más retraso en el lenguaje. Y la AEPap, que reúne a pediatras de
  atención primaria, avisa de que el bilingüismo no explica un problema de
  lenguaje: si lo hay, se nota en los dos idiomas.
de_donde_viene: >
  Speech and Language UK, una entidad británica sobre el habla y el lenguaje,
  cuenta que hace años algunos profesionales aconsejaban a las familias dejar de
  hablar su idioma en casa. Hoy los estudios apuntan a que el bilingüismo es una
  ventaja. Además, la AEPap explica que aprender dos idiomas suele tardar un
  poquito más que aprender uno, aunque la mayoría dice sus primeras palabras
  hacia el año, como los demás. También es habitual que mezclen los dos idiomas
  en una frase, o que hablen poco durante unos meses al empezar con un idioma
  nuevo. Son cosas propias del bilingüismo, aunque a una familia preocupada le
  puedan parecer otra cosa.
que_hacer: >
  Habladle en vuestra lengua y sed constantes. La AEPap explica que a las
  familias les resulta más fácil enseñar en su propio idioma, y que así le
  transmiten su cultura. Speech and Language UK añade que una buena base en un
  idioma ayuda a aprender otros, y que conocer la lengua de casa ayuda a la
  relación con la familia. Si os preocupa cómo habla, pedid una valoración y
  contad cómo se comunica en cada idioma: si hay una dificultad, se verá en los
  dos. Las páginas de la AEPap y de Speech and Language UK hablan de la
  infancia bilingüe en general, no del autismo.
