mito: Es solo ansiedad
variantes:
  - Es timidez, nada más
  - Ya está en tratamiento por ansiedad
dato: >
  Ansiedad y autismo van juntos a menudo: que tenga ansiedad no descarta el
  autismo, y algunas niñas autistas, desde fuera, parecen solo tímidas.
por_que: >
  La ansiedad es muy frecuente en el autismo, así que tenerla no descarta nada:
  puede haber las dos cosas a la vez. Una revisión de 31 estudios con 2.121
  menores autistas encontró mucha ansiedad o un trastorno de ansiedad en casi 4
  de cada 10. Otra revisión, de 2019, contó solo los diagnósticos confirmados, y
  los encontró en 2 de cada 10 personas autistas de distintas edades. La NAS, la
  asociación británica de autismo, avisa de que en las niñas los rasgos
  autistas pueden quedar tapados por otros problemas o confundirse con problemas
  de salud mental. Y AETAPI pide a los profesionales que, ante una niña aislada
  del grupo o con poca iniciativa social, no den por hecho que solo es tímida.
de_donde_viene: >
  Desde fuera, la ansiedad social y el autismo pueden parecerse: retraerse,
  preferir estar a solas, no hablar en grupo o evitar la mirada. Los autores de
  la revisión de 31 estudios reconocen que los dos diagnósticos se solapan.
  Además, la timidez se espera de una niña, y AETAPI explica que por eso no
  llama la atención de docentes ni de profesionales sanitarios. En un estudio
  con 14 mujeres diagnosticadas de adultas, recordaban que en el colegio, por
  ser calladas y obedientes, se las tomaba por tímidas o por buenas. Casi todas
  habían tenido problemas de salud mental, y una contaba que pasó cuatro o cinco
  años en tratamiento por depresión y ansiedad sin que nadie pensara en otra
  cosa.
que_hacer: >
  Si vuestra hija tiene ansiedad, merece atención, y a la vez podéis pedir que
  valoren si hay algo más: una cosa no quita la otra. Contad en la consulta cómo
  está en casa, sobre todo al volver del cole. AETAPI explica que muchas niñas,
  agotadas por la ansiedad y por el esfuerzo de
  [camuflarse](/glosario/masking/), son muy complacientes en el colegio y
  explotan en casa. Las mujeres del estudio lo recordaban igual: buenas en clase
  y crisis en casa al salir. Si ya tiene un diagnóstico de ansiedad y seguís
  viendo cosas que os hacen pensar en el autismo, decidlo: lo explicamos en
  [lo que puede acompañar al autismo](/glosario/comorbilidad/).
relacionados: [comorbilidad, masking, presentacion-femenina]
