mito: Las personas autistas no tienen empatía
variantes:
  - No sienten nada
  - Viven en su mundo y los demás les dan igual
dato: >
  Las personas autistas sienten y pueden empatizar; a veces les cuesta
  reconocer o expresar emociones, y a los demás también les cuesta entenderlas.
por_que: >
  Lo que a muchas personas autistas les cuesta no es sentir, sino reconocer lo
  que sienten y ponerle nombre: se llama alexitimia. Una revisión de 15 estudios
  encontró que la tiene la mitad de las personas autistas, frente a 1 de cada 20
  no autistas. Y cada vez más estudios apuntan a que las dificultades para
  reconocer emociones en una cara o en una voz tienen que ver con la
  alexitimia, no con el autismo. Además, la comprensión falla en las dos
  direcciones: a las personas no autistas también les cuesta saber qué piensa o
  siente una persona autista. En un estudio de 2020, las personas autistas se
  pasaban una historia entre ellas tan bien como las no autistas, y los detalles
  se perdían en los grupos mixtos.
de_donde_viene: >
  Durante años, las dificultades sociales del autismo se explicaron como un
  fallo solo de la persona autista. Pero las personas no autistas reconocen
  peor las expresiones de una persona autista, y tienden a creer que está más
  centrada en sí misma de lo que está. Las autoras del estudio de 2020 proponen
  verlo como un problema de comunicación en las dos direcciones. En otro
  estudio, una mujer autista contaba que mucha gente cree que las personas
  autistas tienen poca empatía. Y que no se dan cuenta de que muchas mujeres
  autistas sí la tienen, aunque se guarden más las cosas.
que_hacer: >
  Si os dicen que no tiene empatía, podéis contestar que siente, aunque a veces
  le cueste reconocer lo que siente o mostrarlo como esperan los demás. Si os
  preocupa cómo se relaciona, fijaos con quién y en qué situaciones se entiende
  bien: puede que con algunas personas conecte mucho. En las fichas de
  alexitimia y de doble empatía tenéis más ejemplos.
relacionados: [alexitimia, doble-empatia]
fuentes: [kinnaird-2019, crompton-2020, hull-2017]
orden: 7
