mito: Las personas autistas tienen una memoria prodigiosa
variantes:
  - Son como Rain Man
  - Se saben de memoria cientos de decimales de pi
  - ¿Y en qué es un genio?
dato: >
  Solo una parte de las personas autistas tiene un talento excepcional, y las
  memorias de película son muy raras.
por_que: >
  Las cifras cambian según cómo se mida: Darold Treffert, en una revisión de
  2009, calcula que hasta 1 de cada 10 personas autistas tiene un talento
  excepcional. Un estudio con 137 personas autistas adultas, que tuvo en cuenta
  unas pruebas y lo que contaban sus familias, llegó a casi 3 de cada 10. Allí
  estos talentos eran más frecuentes en los hombres, 1 de cada 3, que en las
  mujeres, casi 1 de cada 5. Y, según las familias, el más habitual era el
  cálculo, no la memoria. Barry Prizant cuenta que a muchas familias les
  sorprende lo que recuerdan sus hijos e hijas, como los cumpleaños o la
  geografía.
  Pero memorias como la de Daniel Tammet, que llegó a recordar más de 22.000
  cifras de pi, son la excepción.
de_donde_viene: >
  En Rain Man, una película de 1988, el personaje de Dustin Hoffman es autista
  y tiene una memoria enorme. José Ramón Alonso explica que estos talentos
  llaman mucho la atención de quien conoce poco el autismo, aunque son poco
  frecuentes. Alonso también recoge «Sí, sé cómo es el autismo, he visto Rain
  Man» entre las frases que muchas familias no quieren volver a oír.
que_hacer: >
  Si os preguntan en qué es un genio, podéis contestar que solo una parte de
  las personas autistas tiene un talento así. Vuestra hija o hijo tendrá, como
  cualquiera, cosas que se le dan bien y cosas que le cuestan. Conocerlas ayuda
  más que esperar lo que sale en una película. Si el comentario viene de
  alguien cercano, podéis mandarle el enlace a esta página.
