mito: Se le pasará cuando crezca
variantes:
  - Es cosa de la edad
  - De mayor se le quitará
dato: >
  El autismo dura toda la vida, aunque con los años muchas personas autistas
  ganan habilidades y sus dificultades se notan menos.
por_que: >
  El NHS, la sanidad pública británica, explica que con el autismo se nace y
  que no es una enfermedad. La NAS, la asociación británica de autismo, añade
  que se es autista toda la vida. Eso no quiere decir que todo siga igual. La
  guía ESCAP explica que el autismo cambia con la edad, y que muchas personas
  mejoran mucho al crecer en su forma de comunicarse y de relacionarse. Recoge
  también que un pequeño número de adolescentes y jóvenes con buena capacidad
  intelectual deja de cumplir los criterios del diagnóstico. Aun así, siguen
  teniendo dificultades más sutiles.
de_donde_viene: >
  Al crecer, muchas niñas y niños autistas mejoran mucho, y desde fuera puede
  parecer que se les ha pasado. Además, ESCAP explica que un diagnóstico muy
  temprano no permite saber cómo le irá más adelante. Y en las niñas, AETAPI
  cuenta que hacia los seis años algunas empiezan a controlar y a esconder sus
  estereotipias y otras conductas repetitivas. Que no se vea no quiere decir
  que no esté.
que_hacer: >
  Si os dicen que ya se le pasará, podéis contestar que el autismo no se pasa,
  pero que con apoyos le puede ir mucho mejor. La OMS explica que los apoyos
  con base científica pueden mejorar la comunicación, el trato con los demás y
  el bienestar. Y que deben ajustarse a sus necesidades, que cambian con el
  tiempo. Si algo de su desarrollo os preocupa, no esperéis a ver si se pasa:
  ESCAP pide a los médicos que escuchen con atención lo que cuentan las familias.
