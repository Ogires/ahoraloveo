mito: Todos somos un poco autistas
variantes:
  - Yo también soy un poco autista
  - Eso nos pasa a todos
dato: >
  Muchas personas tienen algún rasgo autista, pero el autismo es otra cosa:
  diferencias de toda la vida que afectan mucho al día a día.
por_que: >
  La frase tiene una parte de verdad: la guía ESCAP recoge que las
  características del autismo se reparten, en distinto grado, por toda la
  población. Pero recuerda también que, si no causan dificultades importantes en
  el día a día, no hay diagnóstico. La NAS, la asociación británica de autismo,
  explica que para el diagnóstico hacen falta diferencias de toda la vida en la
  comunicación, en el comportamiento y en los intereses. Todo el mundo juega
  alguna vez con un boli o se enrolla el pelo, por ejemplo. Pero las personas
  autistas suelen hacerlo más, y para ellas puede tener otro sentido e
  importarles mucho más.
de_donde_viene: >
  En parte, viene de la palabra «espectro». La NAS explica que antes se pensaba
  en una línea recta que iba de «más» a «menos» autista, y que no es así. Cada
  persona autista tiene su propia combinación de rasgos. Y como muchos rasgos se
  dan en todo el mundo en algún grado, es fácil confundir tener alguno con ser
  autista.
que_hacer: >
  Si alguien os lo dice, podéis contestar que tener algún rasgo no es lo mismo
  que ser autista. El autismo se nota en muchos ámbitos a la vez, y durante toda
  la vida. Si queréis saber qué se tiene en cuenta para el diagnóstico, en la
  página del diagnóstico tenéis los criterios.
